    base.forEach((t, i) => memo.set(t, i + 1));
    const emit = t => {
      if (memo.has(t)) return memo.get(t);
      let rule = t.rule, cites;
      if (rule === 'H') { rule = 'A'; cites = []; }
      else cites = t.subs.map(emit);
      const r = checkStep(lines, t.f, rule, cites);
      if (!r.ok) throw new Error('verify');
      lines.push({ f: t.f, rule, cites, deps: r.deps, why: t.why });
      memo.set(t, lines.length);
      return lines.length;
    };
    emit(root);
    const last = lines[memo.get(root) - 1];
    if (!last.deps.every(k => k <= prem.length)) throw new Error('deps');
    return lines.slice(0, Math.max(memo.get(root), prem.length));
  }
  let best = null;
  for (let d = 1; d <= 9; d++) {
    try {
      const base = prem.map(f => mk('P', f));
      const root = prove(base, concl, d, new Set(), new Set());
      if (root) {
        let lines;
        if (root.rule === 'P') { lines = prem.map((f, i) => ({ f, rule: 'A', cites: [], deps: [i + 1], prem: true })); lines.final = base.indexOf(root) + 1; }
        else { lines = linearize(root, base); lines.final = lines.length; }
        best = lines; break;
      }
    } catch (e) { if (e.message === 'budget') break; if (e.message !== 'verify' && e.message !== 'deps') throw e; }
  }
  return best;
}

function explainLine(lines, i, premCount) {
  const l = lines[i], c = l.cites, fs = x => `<b class="fx">${show(x)}</b>`, n = i + 1;
  const user = lines.findIndex((m, j) => j > i && m.rule === 'CP' && m.cites[0] === n);
  switch (l.rule) {
    case 'A':
      if (l.prem) return 'Premisa. Závisí sama od seba, preto má vľavo svoje číslo.';
      if (l.why === 'cp') return `Predpoklad. Chceme dokázať implikáciu${user >= 0 ? ' ' + fs(lines[user].f) : ''}, preto si jej antecedent ${fs(l.f)} dočasne predpokladáme a ideme odvodiť konzekvent.`;
      if (l.why === 'or1') return `Predpoklad pre rozbor prípadov: prvý člen disjunkcie, ${fs(l.f)}. Ukážeme, že z neho plynie to, čo potrebujeme.`;
      if (l.why === 'or2') return `Druhý prípad disjunkcie: predpokladáme ${fs(l.f)} a musíme dôjsť k tomu istému záveru ako v prvom prípade.`;
      return `Predpoklad na spor. Predpokladáme ${fs(l.f)} a hľadáme spor (nejaké Y a zároveň ¬Y). Potom RAA dá ${fs(N(l.f))}.`;
    case 'MPP': return `MPP: z implikácie v riadku ${c[0]} a jej antecedentu v riadku ${c[1]} dostaneme konzekvent ${fs(l.f)}.`;
    case 'MTT': return `MTT: riadok ${c[0]} je implikácia a riadok ${c[1]} popiera jej konzekvent, takže neplatí ani antecedent: ${fs(l.f)}.`;
    case 'DN': return l.f.t === 'not' && l.f.a.t === 'not' && eq(l.f.a.a, lines[c[0] - 1].f) ? `DN: k riadku ${c[0]} pridáme dve negácie. Potrebujeme presne tento tvar na ďalší krok.` : `DN: z riadku ${c[0]} odstránime dvojitú negáciu.`;
    case '∧I': return `∧I: riadky ${c[0]} a ${c[1]} spojíme do konjunkcie.`;
    case '∧E': return `∧E: z konjunkcie v riadku ${c[0]} vyberieme jeden člen, ${fs(l.f)}.`;
    case '∨I': return `∨I: keď platí riadok ${c[0]}, platí aj disjunkcia, v ktorej je jedným členom. Druhý člen si môžeme zvoliť.`;
    case 'CP': return `CP: z predpokladu ${c[0]} sme odvodili riadok ${c[1]}, takže platí implikácia ${fs(l.f)}. Predpoklad ${c[0]} sa tým uvoľní a zmizne zo závislostí vľavo.`;
    case 'RAA': return `RAA: predpoklad ${c[0]} viedol k sporu (riadky ${c[1]} a ${c[2]}), takže platí jeho negácia ${fs(l.f)}. Predpoklad ${c[0]} zmizne zo závislostí.`;
    case '∨E': return `∨E: disjunkcia je v riadku ${c[0]}. Z prvého člena (predpoklad ${c[1]}) sme dostali riadok ${c[2]}, z druhého (predpoklad ${c[3]}) riadok ${c[4]}. V oboch prípadoch vyšlo to isté, takže ${fs(l.f)} platí. Predpoklady ${c[1]} a ${c[3]} zmiznú zo závislostí.`;
  }
  if (DRULES[l.rule]) {
    const R = DRULES[l.rule];
    if (l.rule === 'Ekviv') return `Definícia ↔ (v skriptách ↔ def., materiálna ekvivalencia): X ↔ Y je to isté ako (X → Y) ∧ (Y → X). Riadok ${c[0]} prepíšeme na ${fs(l.f)}.`;
    return `${dLabel(l.rule)} (${R.n}): ${c.length ? `z ${c.length === 1 ? 'riadku' : 'riadkov'} ${c.join(', ').replace(/, ([^,]*)$/, ' a $1')} dostaneme` : 'zavedieme teorému'} ${fs(l.f)}. Schéma: <span class="fx">${dSchema(l.rule)}</span>`;
  }
  return '';
}

// ---------- zadanie ----------
function parseTask(str) {
  let s = str.replace(/\|-|├|∴|\/\/|=>>/g, '⊢').replace(/[;\n]+/g, ',').trim();
  if (!s) throw new ParseError('Zadaj formulu alebo argument.');
  const parts = s.split('⊢');
  if (parts.length > 2) throw new ParseError('Znak ⊢ môže byť v zadaní len raz.');
  const norm = x => normalizeInput(x);
  if (parts.length === 1) {
    const items = splitTop(norm(s)).filter(x => x.trim());
    if (items.length > 1) throw new ParseError('Viac formúl oddelených čiarkou je argument. Pred záver daj znak ⊢, napr. P → Q, P ⊢ Q.');
    return { prem: [], concl: parse(norm(s)), single: true };
  }
  if (!parts[1].trim()) throw new ParseError('Za znakom ⊢ chýba záver.');
  const prem = parts[0].trim() ? splitTop(norm(parts[0])).filter(x => x.trim()).map(x => parse(x)) : [];
  return { prem, concl: parse(norm(parts[1])), single: false };
}
const taskText = t => (t.single ? show(t.concl) : `${t.prem.map(x => show(x)).join(', ')} ⊢ ${show(t.concl)}`);

// ---------- tabuľka krok za krokom ----------
const TT_WHY = {
  not: (f, s) => `${s(f)} má vždy opačnú hodnotu ako ${s(f.a)}.`,
  and: (f, s) => `${s(f)} je T len v riadkoch, kde sú ${s(f.a)} aj ${s(f.b)} obe T.`,
  or: (f, s) => `${s(f)} je F len v riadkoch, kde sú ${s(f.a)} aj ${s(f.b)} obe F.`,
  imp: (f, s) => `${s(f)} je F len tam, kde je ${s(f.a)} T a ${s(f.b)} F. Všade inde je T.`,
  iff: (f, s) => `${s(f)} je T tam, kde majú ${s(f.a)} a ${s(f.b)} rovnakú hodnotu.`,
};
function solveTable(el, task) {
  const all = task.prem.concat([task.concl]);
  const vars = varsOf(...all);
  if (vars.length > 5) { el.innerHTML = `<div class="fb show info"><p>Tabuľka by mala ${1 << vars.length} riadkov. Krokové riešenie ukazujem najviac pre 5 premenných.</p></div>`; return; }
  const cols = [], seen = new Set();
  all.forEach(f => subformulas(f).forEach(g => { const k = show(g); if (!seen.has(k)) { seen.add(k); cols.push(g); } }));
  cols.sort((a, b) => depth(a) - depth(b));
  const mainK = new Set(all.map(x => show(x)));
  const rs = rows(vars);
  const s = x => `<b class="fx">${show(x)}</b>`;
  const role = g => { const k = show(g); if (k === show(task.concl) && !task.single) return 'záver'; const i = task.prem.findIndex(p => show(p) === k); return i >= 0 ? `premisa ${i + 1}` : ''; };
  let step = 0; // 0 = len premenné, cols.length + 1 = verdikt
  const total = cols.length + 1;
  const verdict = () => {
    if (task.single) {
      const c = classify(task.concl);
      const txt = { taut: 'Stĺpec formuly obsahuje samé T, takže je to <b>tautológia</b>.', contra: 'Stĺpec formuly obsahuje samé F, takže je to <b>kontradikcia</b>.', cont: 'V stĺpci formuly sú T aj F, takže je to <b>splniteľná formula, ktorá nie je tautológia</b> (kontingencia).' }[c];
      return `<div class="fb show ${c === 'taut' ? 'ok' : 'info'}"><h4>Výsledok</h4><p>${txt}</p></div>`;
    }
    const cex = argCounter(task.prem, task.concl);
    const pt = task.prem.length ? 'všetky premisy T' : 'T';
    if (!cex.length) return `<div class="fb show ok"><h4>Argument je platný</h4><p>Hľadáme riadok, kde sú ${pt} a záver F. Taký riadok v tabuľke nie je${task.prem.length ? ' (riadky, kde sú všetky premisy T, sú zvýraznené a záver je v nich vždy T)' : ''}.</p></div>`;
    return `<div class="fb show bad"><h4>Argument je neplatný</h4><p>Existuje riadok, kde sú všetky premisy T a záver F (zvýraznený červenou). Protipríklad: ${cex.map(v => vars.map(x => `${x} = ${v[x] ? 'T' : 'F'}`).join(', ')).join(' &nbsp;alebo&nbsp; ')}.</p></div>`;
  };
  const draw = () => {
    const done = step >= total;
    let h = '<div class="tt"><table class="truth"><thead><tr>' + vars.map(v => `<th class="v">${v}</th>`).join('') +
      cols.slice(0, Math.min(step, cols.length)).map((c, i) => `<th class="${mainK.has(show(c)) ? 'main' : ''} ${i === step - 1 && !done ? 'cur' : ''}">${show(c)}</th>`).join('') + '</tr></thead><tbody>';
    rs.forEach(v => {
      let cl = '';
      if (done && !task.single) { const pT = task.prem.every(p => evalF(p, v)); if (pT) cl = evalF(task.concl, v) ? 'good' : 'badrow'; }
      h += `<tr class="${cl}">` + vars.map(x => `<td class="v">${v[x] ? 'T' : 'F'}</td>`).join('') +
        cols.slice(0, Math.min(step, cols.length)).map((c, i) => { const b = evalF(c, v); return `<td class="${mainK.has(show(c)) ? 'main' : ''} ${i === step - 1 && !done ? 'cur' : ''}">${b ? 'T' : 'F'}</td>`; }).join('') + '</tr>';
    });
    h += '</tbody></table></div>';
    let ex;
    if (step === 0) ex = `<p>Začíname stĺpcami premenných: ${vars.length} ${vars.length === 1 ? 'premenná' : vars.length < 5 ? 'premenné' : 'premenných'}, teda ${rs.length} riadkov so všetkými kombináciami T a F. Ďalej pôjdeme od najmenších častí formuly k hlavnej spojke.</p>`;
    else if (!done) { const g = cols[step - 1], r = role(g); ex = `<p><b>Krok ${step} z ${cols.length}.</b> ${TT_WHY[g.t](g, s)}${r ? ` Toto je ${task.single ? 'celá formula' : r}.` : mainK.has(show(g)) && task.single ? ' Toto je celá formula.' : ''}</p>`; }
    else ex = verdict();
    el.innerHTML = h + `<div class="sexp">${ex}</div><div class="row snav">${done ? '<button class="btn sagain">Od začiatku</button>' : '<button class="btn primary snext">Ďalší krok</button><button class="btn sall">Ukázať všetko</button>'}</div>`;
    const nx = $('.snext', el); if (nx) nx.addEventListener('click', () => { step++; draw(); });
    const al = $('.sall', el); if (al) al.addEventListener('click', () => { step = total; draw(); });
    const ag = $('.sagain', el); if (ag) ag.addEventListener('click', () => { step = 0; draw(); });
  };
  draw();
}

// ---------- dôkaz krok za krokom ----------
function proofWalk(el, lines, prem, concl, o = {}) {
  const pc = prem.length, fin = lines.final || lines.length;
  const start = Math.max(1, Math.min(pc, lines.length));
  let step = o.all ? lines.length : start;
  if (lines.length <= pc) step = lines.length;
  const draw = () => {
    const done = step >= lines.length;
    const rowsH = lines.slice(0, step).map((l, i) => `<tr class="${l.prem ? 'prem' : ''} ${i === step - 1 && !done ? 'hid' : ''}"><td class="dep">${l.deps.join(',')}</td><td class="n">(${i + 1})</td><td class="fm">${show(l.f)}</td><td class="j">${l.cites.join(',')} ${dLabel(l.rule)}</td></tr>`).join('');
    let ex;
    if (done) {
      ex = `<div class="fb show ok"><h4>Hotovo</h4><p>Riadok ${fin} je záver${pc ? ` a vľavo má len čísla premís (${lines[fin - 1].deps.join(', ') || 'žiadne'})` : ' a nezávisí od žiadneho predpokladu'}, takže dôkaz je úplný.</p></div>
        <ol class="sexpl">${lines.map((l, i) => `<li>${explainLine(lines, i, pc)}</li>`).join('')}</ol>`;
    } else if (step === start && step <= pc) ex = `<p>${pc ? (pc === 1 ? 'Najprv zapíšeme premisu ako riadok 1.' : `Najprv zapíšeme premisy ako riadky 1 až ${pc}.`) : ''} Cieľ je odvodiť <b class="fx">${show(concl)}</b>${pc ? ' tak, aby závisel len od premís' : ' bez závislostí'}. ${proofPlan(prem, concl)}</p>`;
    else ex = `<p><b>Riadok ${step}.</b> ${explainLine(lines, step - 1, pc)}</p>`;
    el.innerHTML = `${o.note || ''}<div class="seq">${prem.map(x => show(x)).join(', ')} ⊢ ${show(concl)}</div><div class="proofwrap"><table class="proof"><tbody>${rowsH}</tbody></table></div>
      <div class="sexp">${ex}</div><div class="row snav">${done ? '<button class="btn sagain">Od začiatku</button>' : '<button class="btn primary snext">Ďalší krok</button><button class="btn sall">Ukázať všetko</button>'}</div>`;
    const nx = $('.snext', el); if (nx) nx.addEventListener('click', () => { step++; draw(); });
    const al = $('.sall', el); if (al) al.addEventListener('click', () => { step = lines.length; draw(); });
    const ag = $('.sagain', el); if (ag) ag.addEventListener('click', () => { step = start; draw(); });
  };
  draw();
}
// krátky plán podľa tvaru záveru
function proofPlan(prem, concl) {
  const s = x => `<b class="fx">${show(x)}</b>`;
  switch (concl.t) {
    case 'imp': return `Záver je implikácia, preto si predpokladáme jej antecedent ${s(concl.a)}, odvodíme ${s(concl.b)} a použijeme CP.`;
    case 'and': return `Záver je konjunkcia, preto odvodíme zvlášť ${s(concl.a)} a ${s(concl.b)} a spojíme ich cez ∧I.`;
    case 'or': return prem.some(p => p.t === 'or') ? 'V premisách je disjunkcia, preto pravdepodobne pôjde o rozbor prípadov (∨E) a záver vznikne cez ∨I.' : `Záver je disjunkcia. Stačí odvodiť jeden jej člen a použiť ∨I. Ak sa to priamo nedá, predpokladáme negáciu záveru a hľadáme spor (RAA).`;
    case 'not': return `Záver je negácia. Skúsime MTT, a ak to nejde, predpokladáme ${s(concl.a)} a hľadáme spor (RAA).`;
    case 'iff': return 'Záver je ekvivalencia, preto dokážeme obe implikácie a spojíme ich.';
  }
  return prem.some(p => p.t === 'or') ? 'Záver je jednoduchý výrok. Pozrieme, čo sa dá z premís vybrať priamo (MPP, MTT, ∧E), a disjunkciu rozoberieme na prípady.' : 'Záver je jednoduchý výrok. Pozrieme, čo sa dá z premís vybrať priamo (MPP, MTT, ∧E). Ak to nestačí, predpokladáme jeho negáciu a hľadáme spor.';
}
function solveProof(el, task) {
  const hadIff = task.prem.concat([task.concl]).some(f => hasOp(f, 'iff'));
  const prem = task.prem, concl = task.concl;
  const cex = argCounter(prem, concl);
  if (cex.length) {
    const vars = varsOf(...prem, concl);
    el.innerHTML = `<div class="fb show bad"><h4>Dôkaz neexistuje</h4><p>${task.single ? 'Formula nie je tautológia, takže sa nedá dokázať bez premís.' : 'Argument je neplatný. Pravidlá dovolia odvodiť len to, čo z premís naozaj vyplýva.'} Protipríklad: ${vars.map(x => `${x} = ${cex[0][x] ? 'T' : 'F'}`).join(', ')}${task.single ? ' (formula je F).' : ' (premisy sú T, záver F).'}</p><p>Pozri si to v tabuľke hodnôt alebo v pravdivostnom strome.</p></div>`;
    return;
  }
  const lines = autoProve(prem, concl, { derived: !!task.derived });
  if (!lines) { el.innerHTML = '<div class="fb show info"><h4>Dôkaz sa nepodarilo nájsť</h4><p>Argument je platný (ukáže to tabuľka hodnôt), ale je príliš zložitý na automatické hľadanie dôkazu. Skús ho rozdeliť na menšie kroky.</p></div>'; return; }
  const note = (hadIff ? '<p class="small muted">Pre ↔ sa používa definícia zo skrípt (↔ def., tu zapísaná ako SI Ekviv): X ↔ Y je to isté ako (X → Y) ∧ (Y → X).</p>' : '');
  const box = document.createElement('div');
  el.innerHTML = ''; el.appendChild(box);
  proofWalk(box, lines, prem, concl, { note });
  el.insertAdjacentHTML('beforeend', '<p class="small muted" style="margin-top:10px">Dôkazov býva viac. Toto je jeden správny postup, tvoj môže vyzerať inak a byť tiež správny.</p>');
}

const GLOSS_L = '[a-záäčďéíĺľňóôŕšťúýž]*';
const GLOSS_RE = new RegExp('(?<![A-Za-zÀ-ž])(?:' + GLOSSARY.map((g, i) => `(?<g${i}>(?:${g[0]})${GLOSS_L})`).join('|') + ')', 'gi');
const GLOSS_SKIP = 'button, input, textarea, select, option, .fx, .term, .termpop, table, .seq, .big, .keys, .tabs, label, h1, h2, h3, h4, summary, .gloss, .tree, .sent, .hardtext, .meta, .syncst, .brand, .score, .grade, .loginbox, script, style';
let glossBusy = false;
function glossify(root) {
  if (!root) return;
  const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => (n.nodeValue.length > 3 && n.parentElement && !n.parentElement.closest(GLOSS_SKIP) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT) });
  const nodes = [];
  while (tw.nextNode()) nodes.push(tw.currentNode);
  for (const n of nodes) {
    const txt = n.nodeValue;
    GLOSS_RE.lastIndex = 0;
    let m, last = 0, frag = null;
    while ((m = GLOSS_RE.exec(txt))) {
      const gi = Object.keys(m.groups).find(k => m.groups[k] !== undefined);
      if (!frag) frag = document.createDocumentFragment();
      frag.appendChild(document.createTextNode(txt.slice(last, m.index)));
      const sp = document.createElement('span');
      sp.className = 'term'; sp.dataset.g = gi.slice(1); sp.tabIndex = 0; sp.setAttribute('role', 'button'); sp.textContent = m[0];
      frag.appendChild(sp);
      last = m.index + m[0].length;
    }
    if (frag) { frag.appendChild(document.createTextNode(txt.slice(last))); n.parentNode.replaceChild(frag, n); }
  }
}
function closeTerm() { const p = document.getElementById('termpop'); if (p) p.remove(); }
function openTerm(sp) {
  closeTerm();
  const g = GLOSSARY[+sp.dataset.g];
  const p = document.createElement('div');
  p.id = 'termpop'; p.className = 'termpop'; p.setAttribute('role', 'tooltip');
  p.innerHTML = `<b>${g[1]}</b><p>${g[2]}</p>`;
  document.body.appendChild(p);
  const r = sp.getBoundingClientRect(), w = Math.min(320, innerWidth - 24);
  p.style.width = w + 'px';
  p.style.left = Math.max(12, Math.min(innerWidth - w - 12, r.left)) + 'px';
  const ph = p.offsetHeight;
  p.style.top = (r.bottom + ph + 12 > innerHeight && r.top - ph - 8 > 0 ? r.top - ph - 6 : r.bottom + 6) + 'px';
}
document.addEventListener('click', e => { const t = e.target.closest && e.target.closest('.term'); if (t) { e.stopPropagation(); openTerm(t); } else if (!e.target.closest || !e.target.closest('.termpop')) closeTerm(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeTerm(); else if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('term')) { e.preventDefault(); openTerm(e.target); } });
window.addEventListener('scroll', closeTerm, true);
(function watchGloss() {
  let queued = false;
  const run = () => {
    queued = false; glossBusy = true;
    try { glossify(document.getElementById('app')); glossify(document.getElementById('theoryOv')); } catch (e) {}
    mo.takeRecords(); glossBusy = false;
  };
  const mo = new MutationObserver(() => { if (glossBusy || queued) return; queued = true; setTimeout(run, 30); });
  mo.observe(document.body, { childList: true, subtree: true });
})();

// ---------- geometria ----------
const VG = {
  2: { w: 300, h: 190, c: [[115, 98, 68], [185, 98, 68]], lab: [[62, 22], [238, 22]] },
  3: { w: 300, h: 260, c: [[118, 92, 66], [182, 92, 66], [150, 150, 66]], lab: [[40, 30], [260, 30], [150, 250]] },
};
function vMask(n, x, y) { let m = 0; VG[n].c.forEach(([cx, cy, r], i) => { if ((x - cx) ** 2 + (y - cy) ** 2 <= r * r) m |= 1 << i; }); return m; }
const V_CENT = {};
for (const n of [2, 3]) {
  const acc = {};
  for (let x = 0; x < VG[n].w; x += 2) for (let y = 0; y < VG[n].h; y += 2) { const m = vMask(n, x, y); if (!m) continue; (acc[m] = acc[m] || [0, 0, 0]); acc[m][0] += x; acc[m][1] += y; acc[m][2]++; }
  V_CENT[n] = {};
  for (const m in acc) V_CENT[n][m] = [acc[m][0] / acc[m][2], acc[m][1] / acc[m][2]];
}
// bod na hranici medzi dvoma oblasťami (na úsečke medzi ich stredmi)
function vEdge(n, a, b) {
  const [x1, y1] = V_CENT[n][a], [x2, y2] = V_CENT[n][b];
  let lo = 0, hi = 1;
  for (let k = 0; k < 30; k++) { const t = (lo + hi) / 2; if (vMask(n, x1 + (x2 - x1) * t, y1 + (y2 - y1) * t) === a) lo = t; else hi = t; }
  return [x1 + (x2 - x1) * lo, y1 + (y2 - y1) * lo];
}
const vRegions = n => Array.from({ length: (1 << n) - 1 }, (_, i) => i + 1);
let vUid = 0;
// st: { shade: Set(mask), xs: [[x,y]], names: [], hi: Set(mask) }
function vennSVG(n, st) {
  const G = VG[n], id = 'v' + (++vUid);
  const regPath = m => {
    // vyplnená oblasť: prienik zahrnutých kruhov mínus ostatné
    const inc = G.c.filter((_, i) => m & (1 << i)), exc = G.c.filter((_, i) => !(m & (1 << i)));
    let g = `<rect x="0" y="0" width="${G.w}" height="${G.h}" />`;
    inc.forEach((c, k) => { g = `<g clip-path="url(#${id}c${G.c.indexOf(c)})">${g}</g>`; });
    return `<g mask="url(#${id}m${m})">${g}</g>`;
  };
  let defs = G.c.map(([cx, cy, r], i) => `<clipPath id="${id}c${i}"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath>`).join('');
  for (const m of vRegions(n)) defs += `<mask id="${id}m${m}"><rect x="0" y="0" width="${G.w}" height="${G.h}" fill="white"/>${G.c.map(([cx, cy, r], i) => (m & (1 << i) ? '' : `<circle cx="${cx}" cy="${cy}" r="${r}" fill="black"/>`)).join('')}</mask>`;
  defs += `<pattern id="${id}h" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" class="vsh-bg"/><line x1="0" y1="0" x2="0" y2="7" class="vsh-ln"/></pattern>`;
  let body = '';
  for (const m of vRegions(n)) {
    if (st.hi && st.hi.has(m)) body += `<g class="vhi">${regPath(m)}</g>`;
    if (st.shade && st.shade.has(m)) body += `<g fill="url(#${id}h)">${regPath(m)}</g>`;
  }
  body += G.c.map(([cx, cy, r]) => `<circle cx="${cx}" cy="${cy}" r="${r}" class="vcirc"/>`).join('');
  body += (st.xs || []).map(([x, y]) => `<g class="vx"><line x1="${x - 7}" y1="${y - 7}" x2="${x + 7}" y2="${y + 7}"/><line x1="${x + 7}" y1="${y - 7}" x2="${x - 7}" y2="${y + 7}"/></g>`).join('');
  body += (st.names || []).map((t, i) => `<text x="${G.lab[i][0]}" y="${G.lab[i][1]}" class="vlab" text-anchor="middle">${esc(t)}</text>`).join('');
  return `<svg class="venn" viewBox="0 0 ${G.w} ${G.h}" role="img" aria-label="Vennov diagram"><defs>${defs}</defs><rect x="2" y="2" width="${G.w - 4}" height="${G.h - 4}" rx="8" class="vbox"/>${body}</svg>`;
}

// q: A všetci S sú P, E žiadni S nie sú P, I niektorí S sú P, O niektorí S nie sú P; s, p = indexy termínov
const QTXT = { A: (s, p) => `Všetci ${s} sú ${p}.`, E: (s, p) => `Žiadni ${s} nie sú ${p}.`, I: (s, p) => `Niektorí ${s} sú ${p}.`, O: (s, p) => `Niektorí ${s} nie sú ${p}.` };
const QNAME = { A: 'všeobecne kladný (A)', E: 'všeobecne záporný (E)', I: 'čiastočne kladný (I)', O: 'čiastočne záporný (O)' };
const QSYM = { A: (s, p) => `(x)(${s}x → ${p}x)`, E: (s, p) => `(x)(${s}x → ¬${p}x)`, I: (s, p) => `(∃x)(${s}x ∧ ${p}x)`, O: (s, p) => `(∃x)(${s}x ∧ ¬${p}x)` };
function qRegions(n, st) {
  const S = 1 << st.s, Pm = 1 << st.p;
  const pos = st.q === 'A' || st.q === 'O' ? m => (m & S) && !(m & Pm) : m => (m & S) && (m & Pm);
  return vRegions(n).filter(pos);
}
const qUniversal = q => q === 'A' || q === 'E';
// výsledok premís: zatienené oblasti a X (jedna oblasť alebo čiara medzi dvoma)
function vennOf(n, stmts) {
  const shade = new Set();
  stmts.filter(s => qUniversal(s.q)).forEach(s => qRegions(n, s).forEach(m => shade.add(m)));
  const xs = [], xinfo = [];
  stmts.filter(s => !qUniversal(s.q)).forEach(s => {
    const cand = qRegions(n, s).filter(m => !shade.has(m));
    xinfo.push({ st: s, cand });
    if (cand.length === 1) xs.push(V_CENT[n][cand[0]]);
    else if (cand.length === 2) xs.push(vEdge(n, cand[0], cand[1]));
  });
  return { shade, xs, xinfo };
}
// platnosť (booleovská interpretácia, bez existenčného predpokladu) cez všetky modely
function sylValid(n, prem, concl) {
  const R = vRegions(n);
  for (let mod = 0; mod < 1 << R.length; mod++) {
    const ne = m => !!(mod & (1 << (m - 1)));
    const holds = st => { const rs = qRegions(n, st); return qUniversal(st.q) ? rs.every(m => !ne(m)) : rs.some(ne); };
    if (prem.every(holds) && !holds(concl)) return false;
  }
  return true;
}

function genSyl(d, wantValid) {
  for (let k = 0; k < 200; k++) {
    const [S, Mt, Pt] = d >= 2 ? pickTerms(3) : ['S', 'M', 'P'];
    const fig = 1 + rnd(4);
    const q1 = pick('AEIO'), q2 = pick('AEIO'), q3 = pick('AEIO');
    // termíny: 0 = S, 1 = M, 2 = P
    const p1 = fig === 1 || fig === 3 ? { q: q1, s: 1, p: 2 } : { q: q1, s: 2, p: 1 };
    const p2 = fig === 1 || fig === 2 ? { q: q2, s: 0, p: 1 } : { q: q2, s: 1, p: 0 };
    const c = { q: q3, s: 0, p: 2 };
    const names = [S, Mt, Pt];
    [p1, p2, c].forEach(x => (x.txt = QTXT[x.q](names[x.s], names[x.p])));

  order.forEach((p, i) => steps.push(qUniversal(p.q) ? `<li>„${esc(p.txt)}“ je všeobecný výrok, preto vytieňujeme časť, ktorá je podľa neho prázdna.</li>` : `<li>„${esc(p.txt)}“ je čiastočný výrok, preto kreslíme X. ${(() => { const x = w.xinfo.find(z => z.st === p); return x.cand.length === 1 ? 'Jedna z možných častí je už vytieňovaná, takže X ide jednoznačne do zvyšnej.' : x.cand.length === 2 ? 'Do ktorej z dvoch častí patrí, nevieme, preto X kreslíme <b>na čiaru</b> medzi ne.' : ''; })()}</li>`));

    const all = rs.every(m => w.shade.has(m));
    verdict = all ? `Záver „${esc(c.txt)}“ by vyžadoval, aby bola vytieňovaná určitá časť kruhov S a P. Tá už vytieňovaná <b>je</b>, takže záver je v diagrame zakreslený a úsudok je <b>platný</b>.` : `Záver „${esc(c.txt)}“ by vyžadoval vytieňovanú časť, ktorá vytieňovaná <b>nie je</b>. Premisy to nezaručujú, úsudok je <b>neplatný</b>.`;
  } else {

const CFG = window.LOGIKA_CONFIG || {};
let sb = null, sbUser = null, remoteBusy = false, remoteDirty = false, remoteTimer = null;
const GUEST_KEY = 'vlogika.guest';

function setSyncStatus(kind) {
  const el = document.getElementById('syncst');
  if (!el) return;
  const txt = { local: 'Postup sa ukladá len v tomto prehliadači', cloud: 'Postup sa ukladá k tvojmu účtu', wait: 'Načítavam tvoj postup…', err: 'Postup sa teraz nedá uložiť na server, skúsim to znova' }[kind];
  el.textContent = txt;
  el.dataset.k = kind;
}
function renderAccount() {
  const el = document.getElementById('acct');
  if (!el) return;
  if (sbUser) {
    el.innerHTML = `<span class="small muted">${esc(sbUser.email || '')}</span> <button class="btn ghost small" id="pwbtn">Zmeniť heslo</button> <button class="btn ghost small" id="lobtn">Odhlásiť</button>`;
    $('#lobtn').addEventListener('click', logout);
    $('#pwbtn').addEventListener('click', changePassword);
  } else if (sb) {
    el.innerHTML = '<button class="btn ghost small" id="libtn">Prihlásiť sa</button>';
    $('#libtn').addEventListener('click', () => { try { sessionStorage.removeItem(GUEST_KEY); } catch (e) {} showLogin(); });
  } else el.innerHTML = '';
}
async function pushRemote() {
  if (!sb || !sbUser) return;
  if (remoteBusy) { remoteDirty = true; return; }
  remoteBusy = true; remoteDirty = false;
  const { error } = await sb.from('progress').upsert({ user_id: sbUser.id, data: S, updated_at: new Date().toISOString() });
  setSyncStatus(error ? 'err' : 'cloud');
  remoteBusy = false;
  if (error) { clearTimeout(remoteTimer); remoteTimer = setTimeout(pushRemote, 15000); }
  else if (remoteDirty) pushRemote();
}
function scheduleRemote() {
  if (!sb || !sbUser) return;
  clearTimeout(remoteTimer);
  remoteTimer = setTimeout(pushRemote, 800);
}
const hasProgress = st => st && (Object.keys(st.levels || {}).length || st.solved);

async function onLogin(user) {
  if (sbUser && sbUser.id === user.id) return;
  sbUser = user;
  hideLogin();
  renderAccount();
  setSyncStatus('wait');
  const { data, error } = await sb.from('progress').select('data').eq('user_id', user.id).maybeSingle();
  if (error) { setSyncStatus('err'); return; }
  if (data && data.data) {
    S = Object.assign(defState(), data.data, { owner: user.id });
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  } else {
    // prvé prihlásenie: prenes postup z prehliadača, len ak nepatrí inému účtu
    if (!(hasProgress(S) && (!S.owner || S.owner === user.id))) S = defState();
    S.owner = user.id;
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
    await pushRemote();
  }
  setSyncStatus('cloud');
  if (!document.querySelector('.task')) route();
}
async function logout() {
  await sb.auth.signOut();
  sbUser = null;
  S = defState();
  try { localStorage.removeItem(KEY); } catch (e) {}
  renderAccount();
  route();
  showLogin();
}
function showLogin(msg) {
  let ov = document.getElementById('loginOv');
  if (!ov) {
    ov = document.createElement('div'); ov.id = 'loginOv'; ov.className = 'overlay login';
    document.body.appendChild(ov);
  }
  ov.innerHTML = `<form class="card stack loginbox" novalidate>
    <div><h2>Prihlásenie</h2><p class="muted small" style="margin-top:4px">Prístup ti vytvorí správca kurzu. Prihlasovací e-mail a heslo dostaneš od neho.</p></div>
    <div><label class="lab" for="lem">E-mail</label><input id="lem" type="email" autocomplete="username" required></div>
    <div><label class="lab" for="lpw">Heslo</label><input id="lpw" type="password" autocomplete="current-password" required></div>
    <div class="lerr small" role="alert">${msg ? esc(msg) : ''}</div>
    <div class="row"><button class="btn primary" type="submit">Prihlásiť sa</button><button class="btn ghost guest" type="button">Pokračovať bez prihlásenia</button></div>
    <p class="small muted">Bez prihlásenia sa postup ukladá len v tomto prehliadači.</p>
  </form>`;
  ov.hidden = false;
  const f = $('form', ov);
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const email = $('#lem', ov).value.trim(), password = $('#lpw', ov).value;
    const err = $('.lerr', ov);
    if (!email || !password) { err.textContent = 'Vyplň e-mail aj heslo.'; return; }
    err.textContent = 'Prihlasujem…';
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { err.textContent = /invalid/i.test(error.message) ? 'Nesprávny e-mail alebo heslo. Ak ešte nemáš prístup, napíš správcovi kurzu.' : 'Prihlásenie zlyhalo: ' + error.message; return; }
    onLogin(data.user);
  });
  $('.guest', ov).addEventListener('click', () => { try { sessionStorage.setItem(GUEST_KEY, '1'); } catch (e) {} hideLogin(); setSyncStatus('local'); renderAccount(); });
  setTimeout(() => $('#lem', ov).focus(), 50);
}
function hideLogin() { const ov = document.getElementById('loginOv'); if (ov) ov.hidden = true; }
function changePassword() {
  let ov = document.getElementById('loginOv');
  if (!ov) { ov = document.createElement('div'); ov.id = 'loginOv'; ov.className = 'overlay login'; document.body.appendChild(ov); }
  ov.innerHTML = `<form class="card stack loginbox" novalidate><h2>Zmena hesla</h2>
    <div><label class="lab" for="np1">Nové heslo (aspoň 8 znakov)</label><input id="np1" type="password" autocomplete="new-password"></div>
    <div><label class="lab" for="np2">Nové heslo znova</label><input id="np2" type="password" autocomplete="new-password"></div>
    <div class="lerr small" role="alert"></div>
    <div class="row"><button class="btn primary" type="submit">Uložiť heslo</button><button class="btn ghost cancel" type="button">Zrušiť</button></div></form>`;
  ov.hidden = false;
  $('.cancel', ov).addEventListener('click', hideLogin);
  $('form', ov).addEventListener('submit', async e => {
    e.preventDefault();
    const a = $('#np1', ov).value, b = $('#np2', ov).value, err = $('.lerr', ov);
    if (a.length < 8) { err.textContent = 'Heslo musí mať aspoň 8 znakov.'; return; }
    if (a !== b) { err.textContent = 'Heslá sa nezhodujú.'; return; }
    const { error } = await sb.auth.updateUser({ password: a });
    if (error) { err.textContent = 'Heslo sa nepodarilo zmeniť: ' + error.message; return; }
    err.textContent = 'Heslo je zmenené.';
    setTimeout(hideLogin, 1200);
  });
}
async function initSync() {
  if (!CFG.url || !CFG.anonKey || !window.supabase) { setSyncStatus('local'); return; }
  sb = window.supabase.createClient(CFG.url, CFG.anonKey);
  sb.auth.onAuthStateChange((ev, session) => {
    if (session && session.user && ev === 'SIGNED_IN') onLogin(session.user);
  });
  const { data: { session } } = await sb.auth.getSession();
  if (session) onLogin(session.user);
  else {
    let guest = false;
    try { guest = sessionStorage.getItem(GUEST_KEY) === '1'; } catch (e) {}
    setSyncStatus('local');
    renderAccount();
    if (!guest) showLogin();
  }
}
// ================= kurz =================
const ex = (lines) => '<div class="ex"><div class="proofwrap"><table class="proof"><tbody>' + lines.map(([d, n, f, j]) => `<tr><td class="dep">${d}</td><td class="n">(${n})</td><td class="fm">${f}</td><td class="j">${j}</td></tr>`).join('') + '</tbody></table></div></div>';
const miniTT = (cols) => { const vs = ['P', 'Q']; return truthTable(vs, cols.map(s => ({ f: P(s) }))); };
const LEVELS = [
  { part: 'Tabuľky hodnôt', t: 'Negácia, konjunkcia, disjunkcia', mix: [['conn', { ops: ['not', 'and', 'or'] }, 3], ['eval', { ops: ['and', 'or'] }, 1]], d: [1, 1], n: 8, pass: 6,
    th: `<p><b>¬P</b> (negácia) má opačnú hodnotu ako P.</p><p><b>P ∧ Q</b> (konjunkcia) je pravdivá len vtedy, keď je pravdivý každý z konjunktov.</p><p><b>P ∨ Q</b> (disjunkcia) je pravdivá, keď je pravdivý aspoň jeden disjunkt. Disjunkcia je inkluzívna: platí aj keď sú pravdivé oba.</p>${miniTT(['¬P', 'P ∧ Q', 'P ∨ Q'])}` },
  { part: 'Tabuľky hodnôt', t: 'Implikácia a ekvivalencia', mix: [['conn', { ops: ['imp', 'iff'] }, 3], ['conn', {}, 1]], d: [1, 1], n: 8, pass: 6,
    th: `<p><b>P → Q</b> (implikácia, kondicionál) je nepravdivá len v jednom prípade: antecedent P je pravdivý a konzekvent Q nepravdivý.</p><p>Z nepravdivého antecedentu je implikácia vždy pravdivá.</p><p><b>P ↔ Q</b> (ekvivalencia, bikondicionál) je pravdivá, keď majú P a Q rovnakú hodnotu.</p>${miniTT(['P → Q', 'Q → P', 'P ↔ Q'])}` },
  { part: 'Tabuľky hodnôt', t: 'Hodnota zloženej formuly', mix: [['eval', {}, 1]], d: [2, 4], n: 8, pass: 6,
    th: '<p>Zloženú formulu vyhodnocuješ zvnútra von. Najprv najvnútornejšie zátvorky, nakoniec <b>hlavná spojka</b>, teda tá, ktorá spája celú formulu.</p><div class="ex">Pri P = T, Q = F, R = T:<br><span class="fx">¬P ∨ (Q → R)</span><br>¬P = F, Q → R = T, takže F ∨ T = <b class="T">T</b>.</div>' },
  { part: 'Tabuľky hodnôt', t: 'Tabuľka hodnôt', mix: [['table', {}, 1]], d: [1, 4], n: 5, pass: 4,
    th: '<p>Tabuľka má 2ⁿ riadkov, kde n je počet premenných: 2 premenné = 4 riadky, 3 premenné = 8 riadkov.</p><p>Pre každú podformulu je jeden stĺpec. Vypĺňaš ich zľava, od najjednoduchších, a posledný stĺpec patrí hlavnej spojke.</p><p>Poradie riadkov je ako v skriptách: prvá premenná T T T T F F F F, druhá T T F F T T F F, tretia T F T F…</p>' },
  { part: 'Tabuľky hodnôt', t: 'Tautológia, kontradikcia, splniteľnosť', mix: [['classify', {}, 1]], d: [1, 4], n: 8, pass: 6,
    th: '<p><b>Tautológia</b> (logická pravda) je pravdivá v každom riadku, napr. P ∨ ¬P.</p><p><b>Kontradikcia</b> je nepravdivá v každom riadku, napr. P ∧ ¬P.</p><p><b>Splniteľná (kontingentná)</b> formula je v niektorých riadkoch T a v iných F.</p><p>Stačí nájsť jeden riadok s F a vieš, že to nie je tautológia.</p>' },
  { part: 'Tabuľky hodnôt', t: 'Ekvivalencia a konzistencia', mix: [['equiv', {}, 1], ['consist', {}, 1]], d: [1, 4], n: 8, pass: 6,
    th: '<p>Dve formuly sú <b>ekvivalentné</b>, ak majú v každom riadku rovnakú hodnotu (A ↔ B je tautológia). Jeden riadok s rozdielom stačí na to, aby neboli.</p><p>Množina viet je <b>konzistentná</b>, ak existuje aspoň jeden riadok, v ktorom sú všetky pravdivé naraz.</p><p>Užitočné ekvivalencie: De Morgan ¬(P ∧ Q) ≡ ¬P ∨ ¬Q, materiálna implikácia P → Q ≡ ¬P ∨ Q, transpozícia P → Q ≡ ¬Q → ¬P.</p>' },
  { part: 'Tabuľky hodnôt', t: 'Platnosť argumentu', mix: [['valid', {}, 1]], d: [1, 5], n: 6, pass: 5,
    th: '<p>Argument je <b>platný</b>, ak neexistuje riadok, v ktorom sú všetky premisy pravdivé a záver nepravdivý.</p><p>Ak taký riadok existuje, je to <b>protipríklad</b> a argument je neplatný. Keď odpovieš „neplatný“, aplikácia ťa poprosí nájsť protipríklad.</p><p>Pozor na dve najčastejšie chyby: afirmácia konzekventu (P → Q, Q, teda P) a negácia antecedentu (P → Q, ¬P, teda ¬Q). Obe sú neplatné.</p>' },
  { part: 'Preklad', t: 'Preklad: a, ale, hoci, alebo, nie je pravda', mix: [['trans', { set: 'basic' }, 1]], d: [1, 4], n: 8, pass: 6,
    th: '<ul><li><b>a, ale, hoci, i keď, aj napriek tomu</b> → konjunkcia ∧</li><li><b>okrem, ale nie</b> → konjunkcia s negáciou: A ∧ ¬B</li><li><b>alebo</b> → ∨ (inkluzívne). „Alebo, ale nie obe“ je (A ∨ B) ∧ ¬(A ∧ B).</li><li><b>Nie je pravda, že A a zároveň B</b> → ¬(A ∧ B)</li><li><b>Ani A, ani B</b> → ¬A ∧ ¬B</li></ul><p>Aplikácia uzná každý zápis, ktorý je ekvivalentný so vzorovým.</p>' },
  { part: 'Preklad', t: 'Nutná a dostatočná podmienka', mix: [['trans', { set: 'cond' }, 1]], d: [1, 4], n: 8, pass: 6,
    th: '<p><b>Pravidlo D – N:</b> dostatočná podmienka ide do antecedentu, nutná do konzekventu. D → N.</p><ul><li>To, že Hilton otvoril hotel, je <b>dostatočnou</b> podmienkou, aby to urobil aj Marriott: <span class="fx">H → M</span></li><li>To, že Hilton otvoril hotel, je <b>nutnou</b> podmienkou, aby to urobil aj Marriott: <span class="fx">M → H</span></li></ul><p><b>ak, pokiaľ, vtedy keď</b> uvádzajú antecedent. <b>iba ak, len ak, len vtedy keď, len pokiaľ</b> uvádzajú konzekvent (nutnú podmienku). <b>vtedy a len vtedy keď, práve vtedy keď</b> → ↔. <b>pokiaľ nie</b> uvádza negovaný antecedent.</p><div class="ex">Guinness varí pivo, ak Jameson destiluje whisky: <span class="fx">J → G</span><br>Guinness varí pivo, iba ak Jameson destiluje whisky: <span class="fx">G → J</span> (alebo ¬J → ¬G)<br>Guinness varí pivo vtedy a len vtedy, keď Jameson destiluje whisky: <span class="fx">G ↔ J</span></div>' },
  { part: 'Pravidlá', t: 'Pravidlá A, ∧I, ∧E, DN', mix: [['rid', { rules: ['A', '∧I', '∧E', 'DN'] }, 1], ['rcon', { rules: ['∧I', '∧E', 'DN'] }, 1], ['proof', { lvl: 10 }, 1]], d: [1, 3], n: 6, pass: 5,
    th: `<p>Dôkaz píšeme Lemmonovým štýlom: <b>závislosti</b> (od ktorých predpokladov riadok závisí), číslo riadku, formula, zdôvodnenie (citované riadky a pravidlo). Závislosti ti tu dopočíta aplikácia.</p><ul><li><b>A</b>: predpoklad môžeš zaviesť kedykoľvek. Premisy sú predpoklady.</li><li><b>∧I</b>: z X a Y odvodíš X ∧ Y.</li><li><b>∧E</b>: z X ∧ Y odvodíš X aj Y. Len keď je ∧ hlavná spojka riadku.</li><li><b>DN</b>: z X odvodíš ¬¬X a z ¬¬X odvodíš X.</li></ul>${ex([['1', 1, 'P ∧ Q', 'A'], ['1', 2, 'P', '1 ∧E'], ['1', 3, 'Q', '1 ∧E'], ['1', 4, 'Q ∧ P', '3,2 ∧I']])}` },
  { part: 'Pravidlá', t: 'MPP a MTT (a typické chyby)', mix: [['rid', { rules: ['MPP', 'MTT', 'AFF', 'NEGANT', '∧E', 'DN'] }, 1], ['rcon', { rules: ['MPP', 'MTT'] }, 1], ['proof', { lvl: 11 }, 1.5]], d: [1, 3], n: 6, pass: 5,
    th: `<ul><li><b>MPP</b> (modus ponendo ponens): z X → Y a X odvodíš Y.</li><li><b>MTT</b> (modus tollendo tollens): z X → Y a ¬Y odvodíš ¬X.</li></ul><p><b>Pozor, najčastejšie chyby:</b> afirmácia konzekventu (X → Y, Y, teda X) a negácia antecedentu (X → Y, ¬X, teda ¬Y). Tieto kroky neplatia.</p><p>Ak máš ¬P → ¬Q a Q, MTT potrebuje ¬¬Q. Najprv urob DN.</p>${ex([['1', 1, '¬P → ¬Q', 'A'], ['2', 2, 'Q', 'A'], ['2', 3, '¬¬Q', '2 DN'], ['1,2', 4, '¬¬P', '1,3 MTT'], ['1,2', 5, 'P', '4 DN']])}` },
  { part: 'Pravidlá', t: 'Disjunkcia: ∨I a ∨E', mix: [['rid', { rules: ['∨I', '∨E', '∧E', 'MPP', 'MTT'] }, 1], ['rcon', { rules: ['∨I', '∨E'] }, 1], ['proof', { lvl: 12 }, 1.5]], d: [1, 4], n: 6, pass: 5,
    th: `<ul><li><b>∨I</b>: z X odvodíš X ∨ Y aj Y ∨ X, kde Y je čokoľvek.</li><li><b>∨E</b> (rozbor prípadov): máš X ∨ Y. Predpokladaj X a odvoď Z. Predpokladaj Y a odvoď tiež Z. Potom platí Z a oba predpoklady sa zo závislostí vypustia. Cituje sa 5 riadkov: disjunkcia, predpoklad 1, záver 1, predpoklad 2, záver 2.</li></ul>${ex([['1', 1, 'P ∨ Q', 'A'], ['2', 2, 'P → R', 'A'], ['3', 3, 'Q → R', 'A'], ['4', 4, 'P', 'A'], ['2,4', 5, 'R', '2,4 MPP'], ['6', 6, 'Q', 'A'], ['3,6', 7, 'R', '3,6 MPP'], ['1,2,3', 8, 'R', '1,4,5,6,7 ∨E']])}` },
  { part: 'Pravidlá', t: 'Kondicionálny dôkaz (CP)', mix: [['rid', { rules: ['CP', 'A', 'MPP', '∨E'] }, 1], ['rcon', { rules: ['CP'] }, 1], ['proof', { lvl: 13 }, 2]], d: [1, 4], n: 6, pass: 5,
    th: `<p><b>CP</b> (teoréma dedukcie): keď chceš dokázať implikáciu X → Y, predpokladaj X, odvoď Y a potom napíš X → Y. Cituješ predpoklad a riadok s Y. Predpoklad X sa zo závislostí vypustí.</p>${ex([['1', 1, 'P → Q', 'A'], ['2', 2, 'Q → R', 'A'], ['3', 3, 'P', 'A'], ['1,3', 4, 'Q', '1,3 MPP'], ['1,2,3', 5, 'R', '2,4 MPP'], ['1,2', 6, 'P → R', '3,5 CP']])}<p>Všimni si závislosti v riadku 6: predpoklad 3 tam už nie je.</p>` },
  { part: 'Pravidlá', t: 'Reductio ad absurdum (RAA)', mix: [['rid', { rules: ['RAA', 'CP', '∧I', 'MTT'] }, 1], ['rcon', { rules: ['RAA'] }, 1], ['proof', { lvl: 14 }, 2]], d: [1, 4], n: 6, pass: 5,
    th: `<p><b>RAA</b> (nepriamy dôkaz): predpokladaj X. Ak z neho odvodíš spor, teda Y ∧ ¬Y (alebo Y a ¬Y), môžeš napísať ¬X a predpoklad X vypustiť. Cituješ predpoklad a spor.</p><p>Keď chceš dokázať Z, predpokladaj ¬Z. RAA dá ¬¬Z a potom DN dá Z.</p>${ex([['1', 1, 'P → Q', 'A'], ['2', 2, 'P → ¬Q', 'A'], ['3', 3, 'P', 'A'], ['1,3', 4, 'Q', '1,3 MPP'], ['2,3', 5, '¬Q', '2,3 MPP'], ['1,2,3', 6, 'Q ∧ ¬Q', '4,5 ∧I'], ['1,2', 7, '¬P', '3,6 RAA']])}` },
  { part: 'Pravidlá', t: 'Dôkazy: všetkých 10 pravidiel', mix: [['proof', { lvl: 15 }, 1]], d: [2, 5], n: 5, pass: 4,
    th: '<p>Teraz už bez obmedzení. Stratégia podľa tvaru záveru:</p><ul><li><b>X → Y</b>: predpokladaj X, odvoď Y, CP.</li><li><b>X ∧ Y</b>: odvoď oba, ∧I.</li><li><b>X ∨ Y</b>: ∨I z jedného člena, alebo ∨E z disjunkcie v premisách.</li><li><b>¬X</b>: MTT, alebo predpokladaj X a RAA.</li><li><b>Atóm</b>: MPP, ∧E, ∨E, alebo predpokladaj jeho negáciu a RAA + DN.</li></ul><p>Tlačidlo Nápoveda najprv ukáže stratégiu, pri druhom ťuknutí konkrétny krok.</p>' },
  { part: 'Slovné úlohy', t: 'Slovné úlohy: preklad a platnosť', mix: [['word', {}, 1]], d: [1, 5], n: 4, pass: 3,
    th: '<p>Úsudok v prirodzenom jazyku najprv prelož podľa schémy (každá premisa a záver zvlášť). Potom rozhodni, či je platný. Ak nie je, nájdi protipríklad.</p><p>Na preklad platí všetko z levelov 8 a 9: D – N, „ak“ vs. „iba ak“, „ale“ = ∧.</p>' },
  { part: 'Slovné úlohy', t: 'Slovné úlohy: dôkaz', mix: [['wordproof', {}, 1]], d: [1, 5], n: 4, pass: 3,
    th: '<p>Ako v skriptách v časti F: prelož úsudok a nájdi jeho dôkaz základnými pravidlami. Dôkaz sa robí so vzorovým prekladom, aby sedeli tvary formúl.</p>' },
  { part: 'Odvodené pravidlá', t: 'Odvodené úsudky: HS, DS, MPT, dilemy', mix: [['drid', { rules: D_BASIC_SET }, 1], ['drcon', { rules: D_BASIC_SET }, 1]], d: [1, 3], n: 8, pass: 6,
    th: '<p>Odvodené pravidlá sú hotové úsudky, ktoré smieš použiť ako skratku. V zdôvodnení sa píše SI a názov.</p><ul><li><b>HS</b>: P → Q, Q → R ⊢ P → R</li><li><b>DS</b>: P ∨ Q, ¬P ⊢ Q</li><li><b>MPT</b>: ¬(P ∧ Q), P ⊢ ¬Q</li><li><b>JD</b>: P → R, Q → R, P ∨ Q ⊢ R</li><li><b>KD</b>: P → Q, R → S, P ∨ R ⊢ Q ∨ S</li><li><b>DD</b>: P → Q, R → S, ¬Q ∨ ¬S ⊢ ¬P ∨ ¬R</li><li><b>CM</b>: P → ¬P ⊢ ¬P</li></ul>' },
  { part: 'Odvodené pravidlá', t: 'Ekvivalencie: DM, Impl, Transp a ďalšie', mix: [['drid', { rules: D_EQ_SET }, 1], ['drcon', { rules: D_EQ_SET }, 1]], d: [1, 3], n: 8, pass: 6,
    th: '<p>Vzájomne odvoditeľné tvrdenia (—||—) hovoria to isté iným tvarom. Riadok môžeš prepísať oboma smermi.</p><ul><li><b>DM</b>: ¬(P ∨ Q) —||— ¬P ∧ ¬Q a ¬(P ∧ Q) —||— ¬P ∨ ¬Q</li><li><b>Impl</b>: P → Q —||— ¬P ∨ Q a ¬(P → Q) —||— P ∧ ¬Q</li><li><b>Transp</b>: P → Q —||— ¬Q → ¬P</li><li><b>Exp</b>: (P ∧ Q) → R —||— P → (Q → R)</li><li><b>Dist</b>, <b>Com</b>, <b>Ekviv</b>: pozri teóriu.</li></ul>' },
  { part: 'Odvodené pravidlá', t: 'Dôkazy so skratkami', mix: [['dproof', {}, 1]], d: [1, 5], n: 4, pass: 3,
    th: '<p>V dôkaze môžeš použiť všetkých 10 základných pravidiel, odvodené pravidlá (SI) aj teorémy (TI). V zozname pravidiel sú pod základnými. Skratka sa používa na celý riadok a tvar musí sedieť presne.</p><p>Keď sa vzdáš, uvidíš celé riešenie krok za krokom.</p>' },
  { part: 'Pravdivostné stromy', t: 'Strom: pravidlá rozkladu', mix: [['trule', {}, 1]], d: [1, 3], n: 8, pass: 6,
    th: '<p>V pravdivostnom strome sa každá zložená formula rozkladá na jednoduchšie.</p><p><b>Bez vetvenia</b> (píše sa pod seba): A ∧ B dá A, B. ¬(A ∨ B) dá ¬A, ¬B. ¬(A → B) dá A, ¬B. ¬¬A dá A.</p><p><b>S vetvením</b>: A ∨ B na A | B. A → B na ¬A | B. ¬(A ∧ B) na ¬A | ¬B. A ↔ B na A, B | ¬A, ¬B. ¬(A ↔ B) na A, ¬B | ¬A, B.</p>' },
  { part: 'Pravdivostné stromy', t: 'Strom: stavba a platnosť argumentu', mix: [['tbuild', {}, 2], ['tread', {}, 1]], d: [1, 4], n: 5, pass: 4,
    th: '<p>Na začiatok stromu ide každá premisa a <b>negácia záveru</b>. Formuly rozkladáš, kým sa dá. Vetva sa uzavrie, keď je na nej formula aj jej negácia.</p><p>Všetky vetvy uzavreté: argument je platný. Zostane otvorená vetva: argument je neplatný a z vetvy prečítaš protipríklad.</p>' },
  { part: 'Pojmy a Vennove diagramy', t: 'Vzťahy medzi pojmami', mix: [['vrel', {}, 1]], d: [1, 4], n: 8, pass: 6,
    th: '<p>Rozsah pojmu sú všetky veci, na ktoré sa vzťahuje. Medzi rozsahmi dvoch pojmov je jeden z piatich vzťahov: <b>totožnosť</b> (rovnaký rozsah), <b>podraďovanie</b> (prvý je celý v druhom), <b>nadraďovanie</b> (prvý obsahuje druhý), <b>kríženie</b> (čiastočne sa prekrývajú) a <b>vylučovanie</b> (nemajú nič spoločné).</p>' },
  { part: 'Pojmy a Vennove diagramy', t: 'Vennov diagram: všetci, žiadni, niektorí', mix: [['vdraw', {}, 2], ['vread', {}, 1]], d: [1, 3], n: 8, pass: 6,
    th: '<p>Vo Vennovom diagrame <b>tieň</b> znamená prázdnu časť a <b>X</b> znamená, že v nej niečo je.</p><ul><li><b>Všetci S sú P</b>: tieň v S mimo P.</li><li><b>Žiadni S nie sú P</b>: tieň v prieniku.</li><li><b>Niektorí S sú P</b>: X v prieniku.</li><li><b>Niektorí S nie sú P</b>: X v S mimo P.</li></ul><p>Na diagram ťukaj: prvé ťuknutie vytieňuje, druhé dá X, tretie vymaže.</p>' },
  { part: 'Pojmy a Vennove diagramy', t: 'Sylogizmy s tromi kruhmi', mix: [['vsyl', {}, 1]], d: [1, 4], n: 6, pass: 5,
    th: '<p>Nakresli tri kruhy (S, M, P). Najprv zakresli všeobecné premisy tieňom, potom čiastočné krížikom. Ak X môže byť v dvoch častiach, patrí na čiaru. Záver nekresli: ak už v diagrame je, úsudok je platný.</p>' },
];

function levelUnlocked(i) { return S.unlockAll || i === 0 || (S.levels[i - 1] && S.levels[i - 1].passed); }
function starsOf(i) { const L = S.levels[i]; return L ? L.stars || 0 : 0; }
const starHTML = n => '<span class="stars">' + [1, 2, 3].map(k => k <= n ? '★' : '<span class="off">★</span>').join('') + '</span>';

// ================= sedenie =================
const appEl = document.getElementById('app');
function rating(id) { return S.rating[id] || 1; }
function runSession(cfg) {
  let i = 0, score = 0;
  const results = [];
  appEl.innerHTML = `<div class="sessbar"><button class="btn ghost back">← Späť</button><div class="pbar">${Array.from({ length: cfg.n }, () => '<i></i>').join('')}</div><span class="small muted cnt"></span></div><div class="card task"></div>`;
  $('.back', appEl).addEventListener('click', () => { save(); route(); });
  const bar = $$('.pbar i', appEl);
  function next() {
    if (i >= cfg.n) return finish();
    bar.forEach((b, k) => b.classList.toggle('now', k === i));
    $('.cnt', appEl).textContent = `${i + 1} / ${cfg.n}`;
    const [id, opts] = cfg.pick(i);
    const d = clamp(Math.round(cfg.diff(id, i)), 1, 5);
    const task = GEN[id].gen(d, opts || {});
    const card = $('.task', appEl);
    card.innerHTML = `<div class="meta"><span>${cfg.test ? `Úloha ${i + 1} · ${cfg.pts[i]} b · ` : ''}${GEN[id].label}</span>${cfg.test ? '' : `<span class="dots" title="náročnosť">${dots(d)}</span><button class="btn howbtn" type="button">Ako na to</button><button class="btn thbtn" type="button">Teória</button>`}</div><div class="howto" hidden></div><div class="body"></div>${notesHTML()}<div class="next"></div>`;
    wireNotes(card);
    const hb = $('.howbtn', card);
    if (hb) hb.addEventListener('click', () => { const h = $('.howto', card); h.hidden = !h.hidden; if (!h.hidden) h.innerHTML = `<p class="tbt">Ako na to</p><ol>${(HOWTO[id] || []).map(x => `<li>${x}</li>`).join('')}</ol>`; });
    card.classList.toggle('testmode', !!cfg.test);
    if (!cfg.test) $('.thbtn', card).addEventListener('click', () => openTheory(chapterFor(id, opts)));
    let got = false;
    task.mount($('.body', card), res => {
      if (got) return; got = true;
      results.push({ ok: res.ok, id, tags: res.tags || [] });
      if (res.ok) score++;
      bar[i].classList.remove('now'); bar[i].classList.add(res.ok ? 'ok' : 'bad');
      if (!cfg.test) S.rating[id] = clamp(rating(id) + (res.ok ? 0.4 : -0.6), 1, 5);
      recordMistakes(res.tags);
      if (res.ok) recordTrained(task.trains);
      S.solved++;
      save();
      const nb = document.createElement('button');
      nb.className = 'btn primary';
      nb.textContent = i + 1 >= cfg.n ? 'Výsledok' : 'Ďalšia úloha';
      nb.addEventListener('click', () => { i++; next(); window.scrollTo({ top: 0 }); });
      $('.next', card).appendChild(nb);
    });
  }
  function finish() {
    const r = cfg.onFinish ? cfg.onFinish(score, results) : {};
    appEl.innerHTML = `<div class="card summary stack"><p class="muted">${esc(cfg.title)}</p><div class="score">${r.scoreText || `${score} / ${cfg.n}`}</div>${r.html || ''}<div class="row" style="justify-content:center">${r.buttons || ''}<button class="btn again">Znova</button><button class="btn primary home">${r.homeLabel || 'Späť'}</button></div></div>`;
    $('.again', appEl).addEventListener('click', () => runSession(cfg));
    $('.home', appEl).addEventListener('click', () => (r.onHome ? r.onHome() : route()));
    if (r.wire) r.wire(appEl);
  }
  next();
}
function weightedPick(mix) {
  const tot = mix.reduce((a, m) => a + (m[2] || 1), 0);
  let x = Math.random() * tot;
  for (const m of mix) { x -= m[2] || 1; if (x <= 0) return m; }
  return mix[mix.length - 1];
}
function startLevel(li) {
  const L = LEVELS[li];
  runSession({
    title: `Level ${li + 1}: ${L.t}`, n: L.n,
    pick: () => { const m = weightedPick(L.mix); return [m[0], m[1]]; },
    diff: id => clamp(rating(id), L.d[0], L.d[1]),
    onFinish(score) {
      const passed = score >= L.pass;
      const stars = score >= L.n ? 3 : score >= L.n - 1 ? 2 : passed ? 1 : 0;
      const prev = S.levels[li] || {};
      S.levels[li] = { passed: prev.passed || passed, stars: Math.max(prev.stars || 0, stars), best: Math.max(prev.best || 0, score) };
      save();
      const hasNext = li + 1 < LEVELS.length;
      return {
        html: passed ? `<p>${starHTML(stars)}</p><p>Level je splnený${hasNext ? ', ďalší sa odomkol' : ''}.</p>` : `<p>Na splnenie treba aspoň ${L.pass} správnych. Skús to znova, náročnosť sa prispôsobí.</p>`,
        buttons: passed && hasNext ? '<button class="btn primary nextlvl">Ďalší level</button>' : '',
        homeLabel: 'Prehľad kurzu',
        onHome: () => { location.hash = 'kurz'; route(); },
        wire: el => { const b = $('.nextlvl', el); if (b) b.addEventListener('click', () => openLevel(li + 1)); },
      };
    },
  });
}
function openLevel(li) {
  const L = LEVELS[li];
  appEl.innerHTML = `<div class="sessbar"><button class="btn ghost back">← Kurz</button></div><div class="card stack"><p class="muted small">LEVEL ${li + 1} · ${L.part.toUpperCase()}</p><h2>${L.t}</h2><div class="theory">${L.th}</div><p class="small muted">${L.n} úloh, na splnenie treba ${L.pass} správnych.</p><div class="row"><button class="btn primary go">Začať</button>${LEVEL_CH[li].map(x => { const k = CHAPTERS.findIndex(c => c.id === x); return `<button class="btn thl" data-k="${k}">Teória: ${esc(CHAPTERS[k].t)}</button>`; }).join('')}</div></div>`;
  $('.back', appEl).addEventListener('click', () => route());
  $('.go', appEl).addEventListener('click', () => startLevel(li));
  $$('.thl', appEl).forEach(b => b.addEventListener('click', () => openTheory(+b.dataset.k)));
  window.scrollTo({ top: 0 });
}

// ================= pohľady =================
function viewCourse() {
  const parts = [...new Set(LEVELS.map(l => l.part))];
  const curIdx = LEVELS.findIndex((_, i) => !(S.levels[i] && S.levels[i].passed));
  let h = `<div class="stack"><div><h2>Kurz</h2><p class="muted">${LEVELS.length} levelov od spojok cez dôkazy a slovné úlohy po odvodené pravidlá, pravdivostné stromy a Vennove diagramy. Každý level má krátke zhrnutie, odkaz na podrobnú teóriu a sadu úloh. Splnený level odomkne ďalší.</p></div>`;
  parts.forEach(p => {
    h += `<div class="part"><h3>${p}</h3><div class="levels">`;
    LEVELS.forEach((L, i) => {
      if (L.part !== p) return;
      const un = levelUnlocked(i), done = S.levels[i] && S.levels[i].passed;
      h += `<button class="lvl ${done ? 'done' : ''} ${i === curIdx ? 'cur' : ''}" data-i="${i}" ${un ? '' : 'disabled'}><span class="num">${i + 1}</span><span><span class="t">${L.t}</span><br><span class="s">${un ? (done ? 'Splnené' : i === curIdx ? 'Na rade' : 'Odomknuté') : 'Zamknuté'}</span></span>${done ? starHTML(starsOf(i)) : '<span></span>'}</button>`;
    });
    h += '</div></div>';
  });
  h += `<label class="row small muted" style="margin-top:12px"><input type="checkbox" id="ua" ${S.unlockAll ? 'checked' : ''}> Odomknúť všetky levely</label></div>`;
  appEl.innerHTML = h;
  $$('.lvl', appEl).forEach(b => b.addEventListener('click', () => openLevel(+b.dataset.i)));
  $('#ua', appEl).addEventListener('change', e => { S.unlockAll = e.target.checked; save(); viewCourse(); });
}
const PRACTICE = [
  ['Tabuľky hodnôt', ['conn', 'eval', 'table', 'classify', 'equiv', 'consist', 'valid']],
  ['Pravidlá a dôkazy', ['rid', 'rcon', 'proof']],
  ['Odvodené pravidlá a skratky', ['drid', 'drcon', 'dproof']],
  ['Pravdivostné stromy', ['trule', 'tbuild', 'tread']],
  ['Pojmy a Vennove diagramy', ['vrel', 'vdraw', 'vread', 'vsyl']],
  ['Preklad a slovné úlohy', ['trans', 'word', 'wordproof']],
];
let practiceDiff = 0;
function viewPractice() {
  let h = `<div class="stack"><div><h2>Voľné precvičovanie</h2><p class="muted">Vyber si jednu tému. Pri voľbe Auto sa náročnosť prispôsobuje tomu, ako sa ti darí.</p></div><div><label class="lab">Náročnosť</label><div class="diffsel">${['Auto', 1, 2, 3, 4, 5].map((x, k) => `<button type="button" data-d="${k}" aria-pressed="${practiceDiff === k}">${x}</button>`).join('')}</div></div>`;
  PRACTICE.forEach(([name, ids]) => {
    h += `<div class="part"><h3>${name}</h3><div class="topics">${ids.map(id => `<button class="topic" data-id="${id}"><span class="t">${GEN[id].label}</span><br><span class="s">${GEN[id].desc}</span><br><span class="small dots">${dots(Math.round(rating(id)))}</span></button>`).join('')}</div></div>`;
  });
  appEl.innerHTML = h + '</div>';
  $$('.diffsel button', appEl).forEach(b => b.addEventListener('click', () => { practiceDiff = +b.dataset.d; viewPractice(); }));
  $$('.topic', appEl).forEach(b => b.addEventListener('click', () => practice(b.dataset.id, {})));
}
function practice(id, opts, title) {
  runSession({
    title: title || GEN[id].label, n: 10,
    pick: () => [id, opts],
    diff: x => (practiceDiff ? practiceDiff : rating(x)),
    onFinish: () => ({ html: '<p>Výsledok sa započítal do tvojich štatistík chýb.</p>' }),
  });
}
function viewWeak() {
  const items = Object.entries(S.mistakes).filter(([t, n]) => n >= 1 && TAGS[t]).sort((a, b) => b[1] - a[1]);
  let h = `<div class="stack"><div><h2>Moje chyby</h2><p class="muted">Aplikácia si pri každej chybe zapamätá, aký typ chyby to bol. Keď určitý typ potom zvládaš, číslo klesá.</p></div>`;
  if (!items.length) h += `<div class="card"><p>Zatiaľ tu nič nie je. Po prvých úlohách sa tu objavia typy chýb, ktoré sa ti stávajú najčastejšie, s tlačidlom na ich cielené precvičenie.</p><p class="small muted" style="margin-top:8px">Vyriešených úloh: ${S.solved}</p></div>`;
  else {
    const max = items[0][1];
    h += `<div class="card"><button class="btn primary mix">Precvičiť moje najčastejšie chyby</button>` + items.map(([t, n]) => `<div class="weak"><div><div>${TAGS[t][0]}</div><div class="bar" style="width:${Math.max(8, (n / max) * 100)}%"></div></div><span class="small muted">${Math.round(n)}×</span><button class="btn" data-t="${t}">Precvičiť</button></div>`).join('') + `<p class="small muted" style="margin-top:10px">Vyriešených úloh: ${S.solved}</p></div>`;
  }
  appEl.innerHTML = h + '<div><button class="btn ghost reset">Vymazať celý postup</button><span class="small muted confirm" hidden> Naozaj? <button class="btn yes">Áno, vymazať</button></span></div></div>';
  $$('.weak .btn', appEl).forEach(b => b.addEventListener('click', () => { const T = TAGS[b.dataset.t]; practice(T[1], T[2] || {}, 'Precvičenie: ' + T[0]); }));
  const mx = $('.mix', appEl);
  if (mx) mx.addEventListener('click', () => {
    const top = items.slice(0, 4);
    runSession({ title: 'Precvičenie mojich chýb', n: 10, pick: () => { const [t] = weightedPick(top.map(([t, n]) => [t, null, n])); return [TAGS[t][1], TAGS[t][2] || {}]; }, diff: x => rating(x), onFinish: () => ({}) });
  });
  $('.reset', appEl).addEventListener('click', () => { $('.confirm', appEl).hidden = false; });
  $('.yes', appEl).addEventListener('click', () => { S = defState(); save(); viewWeak(); });
}

const VIEWS = { kurz: viewCourse, test: viewTest, ries: viewSolver, tazke: viewHard, teoria: viewTheory, trening: viewPractice, chyby: viewWeak };
function route() {
  let v = (location.hash || '').replace('#', '');
  if (!VIEWS[v]) v = 'kurz';
  $$('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.v === v)));
  VIEWS[v]();
}
$$('.tab').forEach(t => t.addEventListener('click', () => { closeTheory(); if (t.dataset.v === 'teoria') theoryCur = -1; if (location.hash === '#' + t.dataset.v) route(); else location.hash = t.dataset.v; }));
window.addEventListener('hashchange', route);
route();
initSync();

</script>
</body>
