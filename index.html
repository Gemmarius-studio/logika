<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trenažér výrokovej logiky</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: jeden stĺpec ~760px, horná lišta s kartami, úlohy ako karty s tabuľkami. Atrament na papieri, T/F ako zelená a tehlová. */
:root {
  --bg: #f3f4f7; --surface: #ffffff; --sunk: #eceef3; --ink: #1a2030; --muted: #5a6376; --line: #d9dde6;
  --accent: #2f45c6; --accent-ink: #ffffff; --accent-soft: #e5e9fb;
  --ok: #1d7347; --ok-soft: #e1f2e8; --bad: #b0281f; --bad-soft: #fbe6e3; --warn: #85570a; --warn-soft: #fbf0d8;
  --t: #1d7347; --f: #b0281f;
  --font-head: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --font-fx: "JetBrains Mono", "Cambria Math", "DejaVu Sans Mono", monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11141b; --surface: #191d27; --sunk: #222734; --ink: #e6e9f0; --muted: #9aa2b4; --line: #2c3342;
  --accent: #8e9cff; --accent-ink: #10132a; --accent-soft: #252c4d;
  --ok: #63d39b; --ok-soft: #16301f; --bad: #ff8d84; --bad-soft: #3a1c1a; --warn: #efc263; --warn-soft: #382c12;
  --t: #63d39b; --f: #ff8d84; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11141b; --surface: #191d27; --sunk: #222734; --ink: #e6e9f0; --muted: #9aa2b4; --line: #2c3342;
  --accent: #8e9cff; --accent-ink: #10132a; --accent-soft: #252c4d;
  --ok: #63d39b; --ok-soft: #16301f; --bad: #ff8d84; --bad-soft: #3a1c1a; --warn: #efc263; --warn-soft: #382c12;
  --t: #63d39b; --f: #ff8d84; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font-body); }
.wrap { max-width: 780px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; }
h1, h2, h3 { font-family: var(--font-head); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.3rem; font-weight: 600; }
h3 { font-size: 1.05rem; font-weight: 600; }
p { margin: 0; }
.fx { font-family: var(--font-fx); font-weight: 600; white-space: nowrap; }
b.fx { font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.stack { display: flex; flex-direction: column; gap: 14px; }

/* hlavička */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.top .wrap { padding-block: 12px 0; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand .sig { font-family: var(--font-fx); color: var(--accent); font-weight: 600; }
.tabs { display: flex; gap: 4px; margin-top: 10px; overflow-x: auto; }
.tab { border: 0; background: none; padding: 8px 12px; border-bottom: 2px solid transparent; color: var(--muted); font-weight: 500; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
main.wrap { padding-top: 20px; }

/* kurz */
.part { margin-top: 18px; }
.part > h3 { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 8px; }
.levels { display: grid; gap: 8px; }
.lvl { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; text-align: left; width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.lvl:hover:not(:disabled) { border-color: var(--accent); }
.lvl .num { font-family: var(--font-head); font-weight: 700; font-size: 1.1rem; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--sunk); }
.lvl.done .num { background: var(--ok-soft); color: var(--ok); }
.lvl.cur .num { background: var(--accent); color: var(--accent-ink); }
.lvl:disabled { opacity: .55; cursor: default; }
.lvl .t { font-weight: 600; }
.lvl .s { color: var(--muted); font-size: .85rem; }
.stars { font-size: .95rem; letter-spacing: 2px; color: var(--warn); white-space: nowrap; }
.stars .off { color: var(--line); }

/* úloha */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.sessbar { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.pbar { display: flex; gap: 4px; flex: 1; min-width: 140px; }
.pbar i { flex: 1; height: 6px; border-radius: 3px; background: var(--sunk); }
.pbar i.ok { background: var(--ok); } .pbar i.bad { background: var(--bad); } .pbar i.now { background: var(--accent); }
.meta { display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; flex-wrap: wrap; }
.dots { letter-spacing: 1px; color: var(--accent); }
.q { font-weight: 500; margin-bottom: 10px; }
.big { font-family: var(--font-fx); font-size: 1.35rem; font-weight: 600; padding: 14px 0; overflow-x: auto; white-space: nowrap; }
.chip { display: inline-flex; gap: 4px; align-items: center; font-family: var(--font-fx); padding: 3px 9px; border-radius: 6px; background: var(--sunk); font-size: .95rem; }
.tv { font-family: var(--font-fx); font-weight: 600; }
.tv.T, .T { color: var(--t); } .tv.F, .F { color: var(--f); }
.choices { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.choices .btn { min-width: 64px; }
.choices .btn.big-tf { font-family: var(--font-fx); font-size: 1.1rem; min-width: 84px; padding: 10px 18px; }
.btn.right { border-color: var(--ok); background: var(--ok-soft); }
.btn.wrong { border-color: var(--bad); background: var(--bad-soft); }
.fb { margin-top: 14px; padding: 12px 14px; border-radius: 8px; display: none; }
.fb.show { display: block; }
.fb.ok { background: var(--ok-soft); }
.fb.bad { background: var(--bad-soft); }
.fb.info { background: var(--warn-soft); }
.fb h4 { margin: 0 0 4px; font-family: var(--font-head); font-size: 1rem; }
.fb.ok h4 { color: var(--ok); } .fb.bad h4 { color: var(--bad); } .fb.info h4 { color: var(--warn); }
.fb p + p, .fb p + .tt, .fb .tt + p { margin-top: 8px; }
.next { margin-top: 14px; display: flex; justify-content: flex-end; }

/* tabuľky */
.tt { overflow-x: auto; max-width: 100%; }
table.truth { border-collapse: collapse; font-family: var(--font-fx); font-size: .92rem; margin-top: 6px; }
table.truth th, table.truth td { border: 1px solid var(--line); padding: 4px 9px; text-align: center; white-space: nowrap; }
table.truth th { font-weight: 600; background: var(--sunk); }
table.truth th.v, table.truth td.v { color: var(--muted); }
table.truth td.main, table.truth th.main { background: var(--accent-soft); }
table.truth tr.good td { background: var(--ok-soft); }
table.truth tr.badrow td { background: var(--bad-soft); }
table.truth td.cell { padding: 0; }
table.truth td.cell button { width: 100%; min-width: 38px; height: 34px; border: 0; background: transparent; font-family: var(--font-fx); font-weight: 600; }
table.truth td.cell button:empty::after { content: "·"; color: var(--muted); }
table.truth td.cell.err { background: var(--bad-soft); outline: 2px solid var(--bad); outline-offset: -2px; }
table.truth td.cell.okc { background: var(--ok-soft); }

/* vstup formuly */
.fin { display: flex; flex-direction: column; gap: 6px; }
.fin input { font-family: var(--font-fx); font-size: 1.05rem; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); width: 100%; min-width: 0; }
.fin input.bad { border-color: var(--bad); }
.fin input.good { border-color: var(--ok); }
.keys { display: flex; gap: 4px; flex-wrap: wrap; }
.keys button { font-family: var(--font-fx); min-width: 36px; height: 34px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-weight: 600; }
.keys button.op { color: var(--accent); }
.keys button:hover { border-color: var(--accent); }
.fin.multi:not(.active) .keys, .fin.multi:not(.active) .parsehint { display: none; }
.parsehint { font-feature-settings: "calt" 0, "liga" 0; font-size: .82rem; color: var(--muted); min-height: 1.2em; }
.parsehint.err { color: var(--bad); }

/* dôkaz */
.seq { font-family: var(--font-fx); font-size: 1.1rem; font-weight: 600; padding: 8px 0 12px; overflow-x: auto; white-space: nowrap; }
.proofwrap { overflow-x: auto; }
table.proof { border-collapse: collapse; font-family: var(--font-fx); font-size: .95rem; width: 100%; }
table.proof td { padding: 5px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.proof td.dep { color: var(--muted); width: 1%; }
table.proof td.n { width: 1%; color: var(--muted); }
table.proof td.j { color: var(--muted); text-align: right; width: 1%; }
table.proof tr.prem td { background: var(--sunk); }
table.proof tr.hid td.fm { color: var(--accent); }
.addline { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 12px; padding: 12px; border: 1px dashed var(--line); border-radius: 8px; }
.addline .row2 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr) auto; gap: 8px; }
.addline select, .addline input.cites, input.deps { font: inherit; font-family: var(--font-fx); padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); min-width: 0; width: 100%; }
label.lab { font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; display: block; margin-bottom: 3px; }

.theory { line-height: 1.65; }
.theory p + p, .theory ul, .theory .ex, .theory p + .tt, .theory .tt + p { margin-top: 10px; }
.theory ul { padding-left: 1.2em; margin-bottom: 0; }
.theory .ex { background: var(--sunk); border-radius: 8px; padding: 10px 12px; }
.gloss { display: grid; gap: 4px; padding: 10px 12px; background: var(--sunk); border-radius: 8px; font-size: .92rem; }
.gloss .fx { display: inline-block; min-width: 1.4em; color: var(--accent); }
.sent { display: grid; gap: 6px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.sent .role { font-size: .75rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.sent .msg { font-size: .9rem; }
.sent .msg.ok { color: var(--ok); } .sent .msg.bad { color: var(--bad); }
.cex { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.cex button { font-family: var(--font-fx); border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; font-weight: 600; }
.weak { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.bar { height: 6px; border-radius: 3px; background: var(--bad); }
.topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.topic { text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.topic:hover { border-color: var(--accent); }
.topic .t { font-weight: 600; }
.topic .s { font-size: .85rem; color: var(--muted); }
.diffsel { display: flex; gap: 4px; flex-wrap: wrap; }
.diffsel button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 11px; }
.diffsel button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.summary { text-align: center; padding: 26px 18px; }
.summary .score { font-family: var(--font-head); font-size: 2.6rem; font-weight: 700; }
@media (max-width: 520px) {
  .card { padding: 14px; }
  .addline .row2 { grid-template-columns: 1fr 1fr; }
  .addline .row2 .btn { grid-column: 1 / -1; }
  .big { font-size: 1.15rem; }
}
@media (prefers-reduced-motion: no-preference) { .fb.show { animation: fade .18s ease-out; } @keyframes fade { from { opacity: .4; transform: translateY(3px); } } }

/* teória */
.theory h4 { font-family: var(--font-head); font-size: 1.02rem; margin: 18px 0 4px; }
.theory ol { padding-left: 1.3em; margin: 8px 0 0; }
.theory code { font-family: var(--font-fx); background: var(--sunk); padding: 1px 5px; border-radius: 4px; }
.theory .tt, .theory .tbox, .theory .ex { margin-top: 12px; }
.theory table.truth td { white-space: normal; }
.excap { font-size: .78rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 6px !important; }
table.proof tr.note td { border-bottom: 1px solid var(--line); color: var(--muted); font-family: var(--font-body); font-size: .82rem; padding-top: 0; white-space: normal; }
table.proof tr:has(+ tr.note) td { border-bottom: 0; }
.tbox { border-radius: 8px; padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--accent-soft); }
.tbox.warn { border-left-color: var(--bad); background: var(--bad-soft); }
.tbox .tbt { font-weight: 600; margin-bottom: 4px; }
.tbox ul { margin-top: 4px !important; }
.thbtn { margin-left: auto; text-transform: none; letter-spacing: 0; padding: 4px 10px; font-size: .85rem; }
.overlay { position: fixed; inset: 0; z-index: 20; background: color-mix(in srgb, var(--ink) 40%, transparent); display: flex; justify-content: center; align-items: stretch; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.ovpanel { background: var(--surface); width: min(780px, 100%); overflow-y: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 32px; }
.ovhead { position: sticky; top: 0; background: var(--surface); display: flex; justify-content: space-between; align-items: center; padding-block: 12px; border-bottom: 1px solid var(--line); margin-bottom: 14px; z-index: 1; }
.ovnav { justify-content: space-between; margin-top: 20px; }
.ovnav .btn { max-width: 48%; text-align: left; }
.ovnav .nxt { text-align: right; }
.ovbody h2 { margin-bottom: 10px; }
.syncst { margin-left: auto; font-size: .78rem; }
.syncst[data-k="cloud"]::before { content: "● "; color: var(--ok); }
.syncst[data-k="local"]::before, .syncst[data-k="err"]::before { content: "● "; color: var(--warn); }
</style>
<style>
.acct { display: inline-flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.acct .btn { padding: 4px 8px; font-size: .82rem; }
.overlay.login { align-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.loginbox { width: min(420px, 100%); }
.loginbox input { font: inherit; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); width: 100%; }
.lerr { color: var(--bad); min-height: 1.2em; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><h1>Trenažér výrokovej logiky</h1><span class="sig">P → Q</span><span id="syncst" class="syncst small muted"></span><span id="acct" class="acct"></span></div>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-v="kurz">Kurz</button>
    <button class="tab" role="tab" data-v="teoria">Teória</button>
    <button class="tab" role="tab" data-v="trening">Precvičovanie</button>
    <button class="tab" role="tab" data-v="chyby">Moje chyby</button>
  </nav>
</div></header>
<main class="wrap" id="app"></main>
<script>
// ================= JADRO: formuly =================
const SYM = { and: '∧', or: '∨', imp: '→', iff: '↔' };
const V = n => ({ t: 'var', n });
const N = a => ({ t: 'not', a });
const B = (t, a, b) => ({ t, a, b });
const neg = f => (f.t === 'not' ? f.a : N(f));

class ParseError extends Error {}

function normalizeInput(s) {
  return s
    .replace(/<->|<=>|<>|≡/g, '↔')
    .replace(/->|=>|⊃/g, '→')
    .replace(/>/g, '→')
    .replace(/=/g, '↔')
    .replace(/[~!\-]/g, '¬')
    .replace(/[&^*·•˄]/g, '∧')
    .replace(/[|+˅]/g, '∨')
    .replace(/v/g, '∨')
    .replace(/[a-uw-z]/g, c => c.toUpperCase());
}

function parse(str) {
  const toks = [];
  for (const ch of str) {
    if (/\s/.test(ch)) continue;
    if ('([{'.includes(ch)) toks.push('(');
    else if (')]}'.includes(ch)) toks.push(')');
    else if ('¬∧∨→↔'.includes(ch)) toks.push(ch);
    else if (/[A-Z]/.test(ch)) toks.push(ch);
    else throw new ParseError(`Neznámy znak „${ch}“.`);
  }
  if (!toks.length) throw new ParseError('Výraz je prázdny.');
  let i = 0;
  const peek = () => toks[i];
  function expr() {
    const items = [unary()];
    let op = null;
    while (i < toks.length && '∧∨→↔'.includes(peek())) {
      const o = toks[i++];
      if (op && o !== op) throw new ParseError('Keď sú vedľa seba rôzne spojky, treba zátvorky, napr. (P ∧ Q) → R.');
      op = o;
      items.push(unary());
    }
    if (!op) return items[0];
    if ((op === '→' || op === '↔') && items.length > 2)
      throw new ParseError(`Reťazec so spojkou ${op} je nejednoznačný. Doplň zátvorky, napr. P ${op} (Q ${op} R).`);
    const t = { '∧': 'and', '∨': 'or', '→': 'imp', '↔': 'iff' }[op];
    return items.reduce((a, b) => B(t, a, b));
  }
  function unary() {
    const tk = peek();
    if (tk === undefined) throw new ParseError('Výraz je neúplný, niečo chýba na konci.');
    if (tk === '¬') { i++; return N(unary()); }
    if (tk === '(') {
      i++;
      const e = expr();
      if (peek() !== ')') throw new ParseError('Chýba zatváracia zátvorka.');
      i++;
      return e;
    }
    if (/[A-Z]/.test(tk)) { i++; return V(tk); }
    if (tk === ')') throw new ParseError('Zatváracia zátvorka je navyše alebo príliš skoro.');
    throw new ParseError(`Pred spojkou ${tk} chýba výraz.`);
  }
  const r = expr();
  if (i < toks.length) throw new ParseError(toks[i] === ')' ? 'Zatváracia zátvorka je navyše.' : 'Medzi dvoma výrazmi chýba spojka.');
  return r;
}
const P = s => parse(normalizeInput(s));

function show(f, top = true) {
  if (f.t === 'var') return f.n;
  if (f.t === 'not') return '¬' + show(f.a, false);
  const s = show(f.a, false) + ' ' + SYM[f.t] + ' ' + show(f.b, false);
  return top ? s : '(' + s + ')';
}
const eq = (a, b) => show(a) === show(b);

function evalF(f, v) {
  switch (f.t) {
    case 'var': return !!v[f.n];
    case 'not': return !evalF(f.a, v);
    case 'and': return evalF(f.a, v) && evalF(f.b, v);
    case 'or': return evalF(f.a, v) || evalF(f.b, v);
    case 'imp': return !evalF(f.a, v) || evalF(f.b, v);
    case 'iff': return evalF(f.a, v) === evalF(f.b, v);
  }
}
// alternatívna (chybná) sémantika na diagnostiku
function evalAlt(f, v, alt) {
  const r = g => evalAlt(g, v, alt);
  switch (f.t) {
    case 'var': return !!v[f.n];
    case 'not': return !r(f.a);
    case 'and': return r(f.a) && r(f.b);
    case 'or': return alt === 'orX' ? r(f.a) !== r(f.b) : r(f.a) || r(f.b);
    case 'imp':

        const a2s = rest.filter(k => L(k).rule === 'A' && eq(F(k), Dd.b));
        if (!a1s.length || !a2s.length) { why = why || `Pre disjunkciu ${fs(Dd)} potrebuješ medzi citovanými riadkami dva predpoklady (A): ${fs(Dd.a)} a ${fs(Dd.b)}.`; continue; }
        const perms = [[0,1,2,3],[0,1,3,2],[0,2,1,3],[0,2,3,1],[0,3,1,2],[0,3,2,1],[1,0,2,3],[1,0,3,2],[1,2,0,3],[1,2,3,0],[1,3,0,2],[1,3,2,0],[2,0,1,3],[2,0,3,1],[2,1,0,3],[2,1,3,0],[2,3,0,1],[2,3,1,0],[3,0,1,2],[3,0,2,1],[3,1,0,2],[3,1,2,0],[3,2,0,1],[3,2,1,0]];
        for (const pm of perms) {
          const [a1, c1, a2, c2] = pm.map(j => rest[j]);
          if (!(L(a1).rule === 'A' && eq(F(a1), Dd.a) && L(a2).rule === 'A' && eq(F(a2), Dd.b))) continue;
          if (!(eq(F(c1), f) && eq(F(c2), f))) { why = `Z oboch predpokladov musíš odvodiť ten istý záver ${fs(f)}, ktorý teraz píšeš. Citované závery sú ${fs(F(c1))} a ${fs(F(c2))}.`; continue; }
          if (c1 >= a1 && c2 >= a2)
            return { ok: true, deps: union(D(d), D(c1).filter(k => k !== a1), D(c2).filter(k => k !== a2)) };
          why = why || 'Každý záver musí nasledovať za svojím predpokladom.';
        }
      }
      return bad(why || 'Citované riadky nezodpovedajú schéme ∨E.');
    }
  }
  return bad('Neznáme pravidlo.');
}

function parseCites(s) {
  const t = s.trim();
  if (!t) return [];
  return t.split(/[\s,;.]+/).filter(Boolean).map(x => Number(x));
}

// nápoveda k dôkazu
function proofHints(lines, premCount, concl) {
  const has = f => lines.some(l => eq(l.f, f));
  const fs = x => `<b class="fx">${show(x)}</b>`;
  // aktuálny cieľ: rozbaľ CP a RAA podľa otvorených predpokladov
  const openAsm = lines.map((l, i) => ({ l, n: i + 1 })).filter(o => o.l.rule === 'A' && o.n > premCount);
  let goal = concl;
  for (let k = 0; k < 6; k++) {
    if (goal.t === 'imp' && openAsm.some(o => eq(o.l.f, goal.a))) { goal = goal.b; continue; }
    if (goal.t === 'not' && openAsm.some(o => eq(o.l.f, goal.a))) { goal = null; break; }
    break;
  }
  const strat = [];
  if (goal === null) strat.push('Máš otvorený predpoklad pre RAA. Teraz hľadaj spor: odvoď nejaké Y aj ¬Y a spoj ich ∧I.');
  else if (has(goal)) strat.push(`Cieľ ${fs(goal)} už máš. Ak ešte závisí od pomocného predpokladu, uvoľni ho pomocou CP, RAA alebo ∨E.`);
  else if (goal.t === 'imp') strat.push(`Cieľ ${fs(goal)} je implikácia. Predpokladaj ${fs(goal.a)} (pravidlo A), odvoď ${fs(goal.b)} a potom použi CP.`);
  else if (goal.t === 'and') strat.push(`Cieľ ${fs(goal)} je konjunkcia. Odvoď zvlášť ${fs(goal.a)} aj ${fs(goal.b)} a spoj ich pravidlom ∧I.`);
  else if (goal.t === 'or') strat.push(`Cieľ ${fs(goal)} je disjunkcia. Ak vieš odvodiť ${fs(goal.a)} alebo ${fs(goal.b)}, stačí ∨I. Ak medzi riadkami máš disjunkciu, skús ∨E (rozbor prípadov). Ak nič z toho, predpokladaj ${fs(N(goal))}, nájdi spor a použi RAA a DN.`);
  else if (goal.t === 'not') strat.push(`Cieľ ${fs(goal)} je negácia. Skús MTT (ak máš implikáciu s konzekventom, ktorého negáciu poznáš), alebo predpokladaj ${fs(goal.a)}, nájdi spor a použi RAA.`);
  else {
    const imp = lines.find(l => l.f.t === 'imp' && eq(l.f.b, goal));
    if (imp) strat.push(`Riadok ${lines.indexOf(imp) + 1} má konzekvent ${fs(goal)}. Odvoď jeho antecedent ${fs(imp.f.a)} a použi MPP.`);
    else strat.push(`Hľadaj riadok, v ktorom sa ${fs(goal)} vyskytuje (napr. v konjunkcii alebo ako konzekvent implikácie). Ak nič nepomáha, predpokladaj ${fs(N(goal))}, nájdi spor, RAA dá ${fs(N(N(goal)))} a DN ${fs(goal)}.`);
  }
  const tact = [];
  lines.forEach((l, i) => {
    const f = l.f;
    if (f.t === 'and' && (!has(f.a) || !has(f.b))) tact.push(`Riadok ${i + 1} je konjunkcia. Rozlož ho pomocou ∧E na ${fs(has(f.a) ? f.b : f.a)}.`);
    if (f.t === 'not' && f.a.t === 'not' && !has(f.a.a)) tact.push(`Na riadok ${i + 1} môžeš použiť DN a dostaneš ${fs(f.a.a)}.`);
    if (f.t === 'imp') {
      const j = lines.findIndex(m => eq(m.f, f.a));
      if (j >= 0 && !has(f.b)) tact.push(`Z riadkov ${i + 1} a ${j + 1} dostaneš pomocou MPP ${fs(f.b)}.`);
      const k = lines.findIndex(m => eq(m.f, N(f.b)));
      if (k >= 0 && !has(N(f.a))) tact.push(`Z riadkov ${i + 1} a ${k + 1} dostaneš pomocou MTT ${fs(N(f.a))}.`);
      if (f.b.t === 'not') {
        const k2 = lines.findIndex(m => eq(m.f, f.b.a));
        if (k2 >= 0 && !has(N(f.b))) tact.push(`Riadok ${k2 + 1} zdvoj negáciou (DN) na ${fs(N(f.b))}. Potom s riadkom ${i + 1} použi MTT.`);
      }
    }
  });
  for (let i = 0; i < lines.length; i++) for (let j = 0; j < lines.length; j++)
    if (eq(lines[j].f, N(lines[i].f)) && openAsm.length)
      tact.unshift(`Riadky ${i + 1} a ${j + 1} si odporujú. Spoj ich ∧I a použi RAA na predpoklad ${openAsm[openAsm.length - 1].n}.`);
  return { strat, tact };
}

function parseSeq(s) {
  const [l, r] = s.split('⊢');
  const prem = l.trim() ? splitTop(l).map(P) : [];
  return { prem, concl: P(r) };
}
function splitTop(s) {
  const out = []; let d = 0, cur = '';
  for (const ch of s) {
    if (ch === '(') d++;
    if (ch === ')') d--;
    if (ch === ',' && d === 0) { out.push(cur); cur = ''; } else cur += ch;
  }
  if (cur.trim()) out.push(cur);
  return out.map(x => x.trim());
}

function truthTable(vars, cols, rowClass) {
  const rs = rows(vars);
  let h = '<div class="tt"><table class="truth"><thead><tr>' + vars.map(v => `<th class="v">${v}</th>`).join('') +
    cols.map(c => `<th class="${c.main ? 'main' : ''}">${c.label || show(c.f)}</th>`).join('') + '</tr></thead><tbody>';
  rs.forEach(v => {
    const cl = rowClass ? rowClass(v) : '';
    h += `<tr class="${cl}">` + vars.map(x => `<td class="v">${v[x] ? 'T' : 'F'}</td>`).join('') +
      cols.map(c => { const b = evalF(c.f, v); return `<td class="${c.main ? 'main' : ''} ${b ? 'T' : 'F'}">${b ? 'T' : 'F'}</td>`; }).join('') + '</tr>';
  });
  return h + '</tbody></table></div>';
}

// vstup formuly s klávesnicou
function formulaInput(letters, placeholder = 'napr. (P ∧ Q) → R', multi = false) {
  const el = document.createElement('div');
  el.className = 'fin' + (multi ? ' multi' : '');
  const id = 'fi' + Math.random().toString(36).slice(2, 8);
  el.innerHTML = `<input id="${id}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${placeholder}">
    <div class="keys">${['¬', '∧', '∨', '→', '↔', '(', ')'].map(k => `<button type="button" class="op" data-k="${k}">${k}</button>`).join('')}${letters.map(k => `<button type="button" data-k="${k}">${k}</button>`).join('')}<button type="button" data-k="⌫" aria-label="Zmazať znak">⌫</button></div>
    <div class="parsehint"></div>`;
  const inp = $('input', el), hint = $('.parsehint', el);
  const update = () => {
    const pos = inp.selectionStart;
    const before = normalizeInput(inp.value.slice(0, pos));
    const all = normalizeInput(inp.value);
    if (all !== inp.value) { inp.value = all; inp.setSelectionRange(before.length, before.length); }
    inp.classList.remove('bad', 'good');
    if (!inp.value.trim()) { hint.textContent = 'Píš aj z klávesnice: -> → , <-> ↔ , & ∧ , v ∨ , ~ ¬'; hint.classList.remove('err'); return; }
    try { const f = parse(inp.value); hint.textContent = 'Čítam ako: ' + show(f); hint.classList.remove('err'); }
    catch (e) { hint.textContent = e.message; hint.classList.add('err'); }
  };
  inp.addEventListener('input', update);
  inp.addEventListener('focus', () => { $$('.fin.multi').forEach(x => x.classList.remove('active')); el.classList.add('active'); });
  $$('.keys button', el).forEach(b => b.addEventListener('mousedown', e => e.preventDefault()));
  $$('.keys button', el).forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.k;
    const s = inp.selectionStart ?? inp.value.length, e = inp.selectionEnd ?? s;
    if (k === '⌫') {
      if (s === e && s > 0) { inp.value = inp.value.slice(0, s - 1) + inp.value.slice(e); inp.setSelectionRange(s - 1, s - 1); }
      else { inp.value = inp.value.slice(0, s) + inp.value.slice(e); inp.setSelectionRange(s, s); }
    } else {
      inp.value = inp.value.slice(0, s) + k + inp.value.slice(e);
      inp.setSelectionRange(s + k.length, s + k.length);
    }
    update();
  }));
  update();
  return {
    el, inp,
    get() {
      const f = parse(inp.value);
      const bad = varsOf(f).filter(x => !letters.includes(x));
      if (letters.length && bad.length) throw new ParseError(`Použi len písmená zo schémy (${letters.join(', ')}). ${bad.join(', ')} v nej nie je.`);
      return f;
    },

function cellWhy(node, v) {
  const r = evalF(node, v);

  const a = evalF(node.a, v), b = evalF(node.b, v);
  const nm = { and: 'konjunkcia', or: 'disjunkcia', imp: 'implikácia', iff: 'ekvivalencia' }[node.t];

}
GEN.table = {

    return {
      trains: ['table'],
      mount(el, done) {
        const rs = rows(vars);
        const cols = subs.map(s => ({ f: s, fill: fillAll || s === subs[subs.length - 1], main: s === subs[subs.length - 1] }));
        let h = `<p class="q">${fillAll ? 'Vyplň všetky stĺpce' : 'Vyplň stĺpec hlavnej spojky'} (ťukni na políčko: T, F, prázdne).</p><div class="big" style="font-size:1.1rem">${show(f)}</div>`;
        h += '<div class="tt"><table class="truth"><thead><tr>' + vars.map(x => `<th class="v">${x}</th>`).join('') + cols.map(c => `<th class="${c.main ? 'main' : ''}">${show(c.f)}</th>`).join('') + '</tr></thead><tbody>';
        rs.forEach((v, ri) => {
          h += '<tr>' + vars.map(x => `<td class="v">${v[x] ? 'T' : 'F'}</td>`).join('') + cols.map((c, ci) => {
            if (!c.fill) { const b = evalF(c.f, v); return `<td class="${b ? 'T' : 'F'}">${b ? 'T' : 'F'}</td>`; }
            return `<td class="cell ${c.main ? 'main' : ''}" data-r="${ri}" data-c="${ci}"><button type="button" aria-label="riadok ${ri + 1}"></button></td>`;
          }).join('') + '</tr>';
        });
        h += '</tbody></table></div><div class="row" style="margin-top:12px"><button class="btn primary chk">Skontrolovať</button><button class="btn ghost reveal">Ukázať riešenie</button></div><div class="fb"></div>';
        el.innerHTML = h;
        $$('td.cell button', el).forEach(b => b.addEventListener('click', () => {
          b.textContent = b.textContent === '' ? 'T' : b.textContent === 'T' ? 'F' : '';

        $('.chk', el).addEventListener('click', () => {

          let empty = 0;
          cells.forEach(td => {
            const v = rs[+td.dataset.r], c = cols[+td.dataset.c];

GEN.consist = {

function argCounter(prem, concl) {

function ruleInst(rule, d) {
  const [X, Y, Z] = metaSubs(d, 3);
  const L = [];
  const add = (f, r, cites, deps) => { L.push({ f, rule: r, cites, deps: deps || [L.length + 1] }); return L.length; };
  const A = f => add(f, 'A', []);
  const flip = Math.random() < .5;
  switch (rule) {
    case 'MPP': { let i, x; if (flip) { x = A(X); i = A(B('imp', X, Y)); } else { i = A(B('imp', X, Y)); x = A(X); } add(Y, 'MPP', [i, x], [1, 2]); break; }
    case 'MTT': { let i, x; if (flip) { x = A(N(Y)); i = A(B('imp', X, Y)); } else { i = A(B('imp', X, Y)); x = A(N(Y)); } add(N(X), 'MTT', [i, x], [1, 2]); break; }
    case 'AFF': { const i = A(B('imp', X, Y)), x = A(Y); add(X, 'AFF', [i, x], [1, 2]); break; }
    case 'NEGANT': { const i = A(B('imp', X, Y)), x = A(N(X)); add(N(Y), 'NEGANT', [i, x], [1, 2]); break; }
    case '∧I': { const a = A(X), b = A(Y); add(flip ? B('and', Y, X) : B('and', X, Y), '∧I', flip ? [b, a] : [a, b], [1, 2]); break; }
    case '∧E': { A(B('and', X, Y)); add(flip ? Y : X, '∧E', [1], [1]); break; }
    case '∨I': { A(X); add(flip ? B('or', Z, X) : B('or', X, Z), '∨I', [1], [1]); break; }
    case 'DN': { if (flip) { A(N(N(X))); add(X, 'DN', [1], [1]); } else { A(X); add(N(N(X)), 'DN', [1], [1]); } break; }
    case 'A': { A(B('imp', X, Y)); A(Y); add(flip ? X : Z, 'A', []); break; }
    case 'CP': { A(B('imp', X, Y)); A(B('imp', Y, Z)); A(X); add(Y, 'MPP', [1, 3], [1, 3]); add(Z, 'MPP', [2, 4], [1, 2, 3]); add(B('imp', X, Z), 'CP', [3, 5], [1, 2]); break; }
    case 'RAA': { A(B('imp', X, Y)); A(N(Y)); A(X); add(Y, 'MPP', [1, 3], [1, 3]); add(B('and', Y, N(Y)), '∧I', [4, 2], [1, 2, 3]); add(N(X), 'RAA', [3, 5], [1, 2]); break; }
    case '∨E': { A(B('or', X, Y)); A(B('imp', X, Z)); A(B('imp', Y, Z)); A(X); add(Z, 'MPP', [2, 4], [2, 4]); A(Y); add(Z, 'MPP', [3, 6], [3, 6]); add(Z, '∨E', [1, 4, 5, 6, 7], [1, 2, 3]); break; }
  }
  return L;
}

function glossHTML(g) {

function makeTrans(d, set) {
  if (d >= 3 && Math.random() < 0.5) {
    const c = TR_CURATED.filter(t => !set || t.set === set);
    if (c.length) {
      const t = pick(c);
      const g = typeof t.g === 'string' ? SCHEMAS[t.g] : t.g;
      return { s: t.s, f: P(t.f), gloss: g };
    }
  }
  const tpls = (set === 'basic' ? TPL_BASIC : set === 'cond' ? TPL_COND : TPL_BASIC.concat(TPL_COND)).filter(t => t[2] <= d);
  const [txt, form] = pick(tpls);
  const sch = SCHEMAS[pick(Object.keys(SCHEMAS))];
  const keys = shuffle(Object.keys(sch)).slice(0, 3);
  const pol = keys.map(() => d <= 1 ? true : Math.random() < (d >= 3 ? 0.6 : 0.75));
  const lit = i => (pol[i] ? V(keys[i]) : N(V(keys[i])));
  const text = i => sch[keys[i]][pol[i] ? 0 : 1];
  let s = txt.replace('{X}', text(0)).replace('{Y}', text(1)).replace('{Z}', text(2));
  s = cap(s);
  const f = subst(P(form), { X: lit(0), Y: lit(1), Z: lit(2) });
  const used = varsOf(f);
  const gloss = Object.fromEntries(Object.keys(sch).filter(k => used.includes(k) || Math.random() < 0.3).map(k => [k, sch[k][0]]));
  return { s, f, gloss };
}

        choiceButtons($('.choices', s2), [{ label: 'Platný', value: true }, { label: 'Neplatný', value: false }], u => {
          if (u !== valid) {
            tags.push('valid');
            feedback($('.fb', el), 'bad', valid ? 'Nie, argument je platný' : 'Nie, argument je neplatný', valid ? '<p>Neexistuje situácia, v ktorej sú premisy pravdivé a záver nepravdivý.</p>' : `<p>Protipríklad: ${valChips(cex[0])}. Premisy sú pravdivé a záver nepravdivý.</p>`);
            if (withProof && valid) { $('.fb', el).innerHTML += '<p>Skús ho teraz dokázať.</p>'; runProof(false); }
            else done({ ok: false, tags });
          } else if (!valid) {
            counterPicker($('.cexs', s2), prem, concl, (ok, tries) => {
              if (!ok) tags.push('cex');
              feedback($('.fb', el), ok ? 'ok' : 'bad', ok ? 'Výborne, argument je neplatný a protipríklad sedí' : 'Protipríklad sa nenašiel', ok ? '' : `<p>Napríklad ${valChips(cex[0])}.</p>`);
              done({ ok: ok && firstTry, tags });
            });
          } else if (withProof) {
            feedback($('.fb', el), 'ok', 'Správne, argument je platný', '<p>Teraz ho dokáž.</p>');
            runProof(firstTry);
          } else {
            feedback($('.fb', el), 'ok', 'Správne, argument je platný', truthTable(vs, prem.map(f => ({ f })).concat([{ f: concl, main: true }]), v => prem.every(p => evalF(p, v)) ? 'good' : ''));
            done({ ok: firstTry, tags });
          }
          return valid;
        });
      }
      function runProof(prevOk) {
        const pf = $('.pf', $('.step2', el));
        pf.style.marginTop = '14px';
        proofBuilder(pf, prem, concl, r => done({ ok: prevOk && r.ok, tags: tags.concat(r.tags) }));
      }
    },
  };
}

const tt = (vars, cols, rc) => truthTable(vars, cols.map(c => typeof c === 'string' ? { f: P(c) } : { f: P(c[0]), main: true }), rc);

const CHAPTERS = [
  { id: 'vyrok', part: 'Základy', t: 'Výroky a spojky', gens: ['conn'], html: `
<p><b>Výrok</b> je oznamovacia veta, o ktorej má zmysel povedať, či je pravdivá alebo nepravdivá. „Ján tancuje“ je výrok. „Tancuj!“ ani „Tancuje Ján?“ výroky nie sú.</p>
<p>Výroková logika neskúma, <i>o čom</i> výroky hovoria. Zaujíma ju len ich <b>pravdivostná hodnota</b>: pravda (T) alebo nepravda (F). Preto jednoduché výroky nahrádzame <b>výrokovými premennými</b> P, Q, R… a sledujeme, ako sa hodnota zloženého výroku určí z hodnôt jeho častí.</p>
<p>Zložené výroky tvoríme <b>spojkami</b>:</p>
<div class="tt"><table class="truth"><thead><tr><th>symbol</th><th>názov</th><th>čítame</th><th>príklad</th></tr></thead><tbody>
<tr><td>¬</td><td style="text-align:left">negácia</td><td style="text-align:left">nie je pravda, že…</td><td>¬P</td></tr>

<tr><td>→</td><td style="text-align:left">implikácia (kondicionál)</td><td style="text-align:left">ak…, tak…</td><td>P → Q</td></tr>
<tr><td>↔</td><td style="text-align:left">ekvivalencia (bikondicionál)</td><td style="text-align:left">vtedy a len vtedy, keď</td><td>P ↔ Q</td></tr>
</tbody></table></div>
<p>V implikácii P → Q sa P volá <b>antecedent</b> (predchodca, podmienka) a Q <b>konzekvent</b> (následok). Členy konjunkcie sú <b>konjunkty</b>, členy disjunkcie <b>disjunkty</b>.</p>
<p><b>Hlavná spojka</b> je tá, ktorá spája celú formulu. V ${F_('(P ∧ Q) → R')} je hlavná spojka →, celá formula je teda implikácia. V ${F_('P ∧ (Q → R)')} je hlavná spojka ∧, celá formula je konjunkcia. Zátvorky preto menia význam.</p>

  { id: 'spojky', part: 'Tabuľky hodnôt', t: 'Pravdivostné hodnoty spojok', gens: ['conn'], html: `
<p>Každá spojka je presne určená tabuľkou. Tieto tabuľky treba vedieť naspamäť, všetko ostatné z nich vychádza.</p>
${tt(['P', 'Q'], ['¬P', 'P ∧ Q', 'P ∨ Q', 'P → Q', 'P ↔ Q'])}
<h4>Negácia ¬</h4><p>Obracia hodnotu. Ak je P pravdivé, ¬P je nepravdivé a naopak. ¬¬P má rovnakú hodnotu ako P.</p>
<h4>Konjunkcia ∧</h4><p>Pravdivá <b>len vtedy</b>, keď sú pravdivé oba konjunkty. Stačí jeden nepravdivý a celá konjunkcia je nepravdivá.</p>
<h4>Disjunkcia ∨</h4><p>Pravdivá, keď je pravdivý <b>aspoň jeden</b> disjunkt. Nepravdivá len keď sú oba nepravdivé.</p>
${box('warn', 'Pozor: disjunkcia je inkluzívna', `<p>V bežnej reči „alebo“ niekedy znamená „jedno alebo druhé, ale nie obe“ (čaj alebo káva). V logike ∨ platí <b>aj vtedy, keď sú pravdivé obe</b> strany: T ∨ T = T.</p>`)}
<h4>Implikácia →</h4><p>Nepravdivá <b>len v jednom prípade</b>: antecedent je pravdivý a konzekvent nepravdivý (T → F). Vo všetkých ostatných riadkoch je pravdivá.</p>
<p>Pomôže predstaviť si implikáciu ako sľub: „Ak zložíš skúšku, dostaneš bicykel.“ Sľub je porušený len vtedy, keď skúšku zložíš a bicykel nedostaneš. Ak skúšku nezložíš, sľub porušený nie je, nech bicykel dostaneš alebo nie.</p>

<h4>Ekvivalencia ↔</h4><p>Pravdivá, keď majú obe strany <b>rovnakú hodnotu</b> (obe T alebo obe F). P ↔ Q znamená to isté ako (P → Q) ∧ (Q → P).</p>

  { id: 'eval', part: 'Tabuľky hodnôt', t: 'Hodnota zloženej formuly', gens: ['eval'], html: `
<p>Hodnotu zloženej formuly počítame <b>zvnútra von</b>: najprv premenné, potom najvnútornejšie zátvorky, nakoniec hlavná spojka. Každý krok je len použitie jednej tabuľky spojky.</p>

${box('warn', 'Typické chyby', `<p>Zlá hlavná spojka (nevšímanie si zátvoriek), F → X vyhodnotené ako F a T ∨ T vyhodnotené ako F. Aplikácia pri chybe skúsi uhádnuť, ktorá z nich to bola, a ukáže postup po krokoch.</p>`)}` },

  { id: 'tabulka', part: 'Tabuľky hodnôt', t: 'Tabuľka hodnôt', gens: ['table'], html: `
<p>Tabuľka hodnôt ukazuje hodnotu formuly pre <b>všetky možné kombinácie</b> hodnôt premenných. Pri n premenných je kombinácií 2ⁿ: 1 premenná 2 riadky, 2 premenné 4 riadky, 3 premenné 8 riadkov, 4 premenné 16 riadkov.</p>

  { id: 'taut', part: 'Tabuľky hodnôt', t: 'Tautológia, kontradikcia, splniteľnosť', gens: ['classify'], html: `

  { id: 'ekviv', part: 'Tabuľky hodnôt', t: 'Ekvivalencia a konzistencia', gens: ['equiv', 'consist'], html: `
<h4>Logická ekvivalencia</h4>
<p>Formuly A a B sú <b>ekvivalentné</b> (A ≡ B, v skriptách A —||— B), ak majú v <b>každom</b> riadku rovnakú hodnotu. Inak povedané, A ↔ B je tautológia. Na vyvrátenie stačí nájsť jeden riadok, kde sa líšia.</p>
<p>Najdôležitejšie ekvivalencie (zo skrípt, pravidlá na substitúciu):</p>
<div class="tt"><table class="truth"><tbody>
<tr><td style="text-align:left">De Morganove zákony</td><td>¬(P ∨ Q) ≡ ¬P ∧ ¬Q<br>¬(P ∧ Q) ≡ ¬P ∨ ¬Q</td></tr>
<tr><td style="text-align:left">materiálna implikácia</td><td>P → Q ≡ ¬P ∨ Q<br>P → Q ≡ ¬(P ∧ ¬Q)</td></tr>
<tr><td style="text-align:left">transpozícia</td><td>P → Q ≡ ¬Q → ¬P</td></tr>
<tr><td style="text-align:left">exportácia</td><td>(P ∧ Q) → R ≡ P → (Q → R)</td></tr>
<tr><td style="text-align:left">distributivita</td><td>P ∧ (Q ∨ R) ≡ (P ∧ Q) ∨ (P ∧ R)<br>P ∨ (Q ∧ R) ≡ (P ∨ Q) ∧ (P ∨ R)</td></tr>
<tr><td style="text-align:left">materiálna ekvivalencia</td><td>P ↔ Q ≡ (P → Q) ∧ (Q → P)<br>P ↔ Q ≡ (P ∧ Q) ∨ (¬P ∧ ¬Q)</td></tr>
<tr><td style="text-align:left">komutativita, asociativita</td><td>P ∧ Q ≡ Q ∧ P, P ∨ Q ≡ Q ∨ P<br>P ∨ (Q ∨ R) ≡ (P ∨ Q) ∨ R</td></tr>
<tr><td style="text-align:left">dvojitá negácia</td><td>P ≡ ¬¬P</td></tr>
<tr><td style="text-align:left">negácia implikácie</td><td>¬(P → Q) ≡ P ∧ ¬Q</td></tr>
</tbody></table></div>
${box('warn', 'Čo ekvivalentné NIE JE', `<ul><li>${F_('¬(P ∧ Q)')} nie je ${F_('¬P ∧ ¬Q')}. De Morgan mení ∧ na ∨.</li><li>${F_('P → Q')} nie je ${F_('Q → P')} (obrátená implikácia).</li><li>${F_('P → Q')} nie je ${F_('¬P → ¬Q')}. Transpozícia strany aj prehadzuje: ¬Q → ¬P.</li><li>${F_('P → (Q → R)')} nie je ${F_('(P → Q) → R')}.</li></ul>`)}
<h4>Konzistencia</h4>

  { id: 'platnost', part: 'Tabuľky hodnôt', t: 'Platnosť argumentu', gens: ['valid'], html: `
<p><b>Argument</b> (úsudok) má premisy a záver. Je <b>platný</b>, ak záver <i>nevyhnutne</i> vyplýva z premís: neexistuje situácia, v ktorej by boli všetky premisy pravdivé a záver nepravdivý.</p>
<p>Platnosť nehovorí nič o tom, či sú premisy naozaj pravdivé. Hovorí len, že <b>ak</b> sú pravdivé, musí byť pravdivý aj záver.</p>
<h4>Metóda tabuľky</h4><ol><li>Urob tabuľku so stĺpcami pre všetky premisy a záver.</li><li>Nájdi riadky, kde sú <b>všetky premisy T</b>.</li><li>Ak je v niektorom z nich záver F, je to <b>protipríklad</b> a argument je neplatný. Ak je záver všade T, argument je platný.</li></ol>
<div class="ex"><p class="excap">Riešený príklad: P → Q, Q ∴ P</p>${tt(['P', 'Q'], ['P → Q', 'Q', ['P']], v => (!v.P || v.Q) && v.Q ? (v.P ? 'good' : 'badrow') : '')}<p>Premisy sú T v riadkoch 1 a 3. V riadku 3 je záver F, takže P = F, Q = T je protipríklad. Argument je neplatný. Je to <b>afirmácia konzekventu</b>.</p></div>

  { id: 'preklad', part: 'Preklad', t: 'Preklad viet do symbolov', gens: ['trans'], opts: { set: 'basic' }, html: `
<p>Pri preklade najprv nájdi jednoduché výroky a priraď im písmená (schéma). Potom urči, ako sú spojené, a začni <b>hlavnou spojkou</b> celej vety.</p>
<div class="tt"><table class="truth"><thead><tr><th>slovenské vyjadrenie</th><th>preklad</th></tr></thead><tbody>
<tr><td style="text-align:left">nie, nie je pravda, že</td><td>¬A</td></tr>
<tr><td style="text-align:left">a, aj, ale, hoci, i keď, aj napriek tomu, že, zatiaľ čo</td><td>A ∧ B</td></tr>
<tr><td style="text-align:left">okrem, ale nie</td><td>A ∧ ¬B</td></tr>
<tr><td style="text-align:left">alebo</td><td>A ∨ B</td></tr>

<p>„Ale“, „hoci“ a „i keď“ vyjadrujú v reči kontrast alebo prekvapenie. Logika ho nezachytí, zostáva len to, že platia obe časti.</p>
${box('warn', 'Rozsah negácie', `<p>„<b>Nie je pravda, že</b> Pakistan aj India zatvárajú väzňov“ popiera konjunkciu ako celok: ${F_('¬(P ∧ I)')}. Môže to byť tak, že jeden zatvára a druhý nie.</p><p>„Pakistan a India <b>nezatvárajú</b> väzňov“ hovorí o oboch: ${F_('¬P ∧ ¬I')}.</p><p>Podľa De Morgana ${F_('¬(P ∨ I)')} ≡ ${F_('¬P ∧ ¬I')}, takže „ani P, ani I“ môžeš napísať aj ako ¬(P ∨ I).</p>`)}

${box('tip', 'Ekvivalentné zápisy', `<p>Aplikácia uzná každý preklad, ktorý je s vzorovým ekvivalentný. Ak je odpoveď zlá, skúsi pomenovať typ chyby: zamenený antecedent a konzekvent, chýbajúca negácia, ∧ namiesto ∨ a podobne.</p>`)}` },

  { id: 'nd', part: 'Preklad', t: 'Nutná a dostatočná podmienka', gens: ['trans'], opts: { set: 'cond' }, html: `
<p>Udalosť A je <b>dostatočná</b> (postačujúca) podmienka pre udalosť B, keď A je všetko, čo je potrebné na uskutočnenie B. Udalosť A je <b>nutná</b> (nevyhnutná) podmienka pre B, keď sa B nemôže uskutočniť bez A.</p>
<div class="ex"><p>Mať zimnicu je <b>dostatočná</b> podmienka na to, aby sa človek cítil zle. Aj iné veci môžu byť dôvodom, ale zimnica sama osebe stačí: ${F_('Z → C')} (Z má zimnicu, C cíti sa zle).</p><p>Vzduch na dýchanie je <b>nutná</b> podmienka na prežitie. Na prežitie treba aj iné veci, ale bez vzduchu je prežitie nemožné: ${F_('P → V')} (P prežije, V má vzduch; ak prežil, mal vzduch).</p></div>
<h4>Pravidlo D – N</h4>
<p>Dostatočná podmienka ide do <b>antecedentu</b>, nutná do <b>konzekventu</b>: <b>D → N</b>. <i>Antecedent je vždy dostatočnou podmienkou</i>, konzekvent je vždy nutnou podmienkou.</p>
<ul><li>To, že Hilton otvoril hotel, je dostatočnou podmienkou, aby to urobil aj Marriott: ${F_('H → M')}</li><li>To, že Hilton otvoril hotel, je nutnou podmienkou, aby to urobil aj Marriott: ${F_('M → H')}</li></ul>
<h4>„ak“ vs. „iba ak“</h4>
<p>Funkcia „iba ak“ je v istom zmysle opačná ako funkcia „ak“. „Chytíš rybu, <b>len ak</b> máš návnadu“ neznamená „ak máš návnadu, chytíš rybu“. Keby to tak bolo, každý s návnadou by chytil rybu. Znamená to „ak nemáš návnadu, nechytíš rybu“, čo je to isté ako „ak chytíš rybu, máš návnadu“: ${F_('R → N')} (R chytíš rybu, N máš návnadu).</p>
${box('tip', 'Pravidlo', `<p>Výrok, ktorý nasleduje za <b>„ak“</b>, je vždy <b>antecedent</b>. Výrok, ktorý nasleduje za <b>„iba ak“</b>, je vždy <b>konzekvent</b>.</p><ul><li>Ak Guinness varí pivo, potom Jameson destiluje whisky: ${F_('G → J')}</li><li>Guinness varí pivo, ak Jameson destiluje whisky: ${F_('J → G')}</li><li>Guinness varí pivo, iba ak Jameson destiluje whisky: ${F_('G → J')} (alebo ${F_('¬J → ¬G')})</li><li>Guinness varí pivo vtedy a len vtedy, keď Jameson destiluje whisky: ${F_('G ↔ J')}</li></ul>`)}
<h4>Ďalšie rady</h4>
<ul><li><b>pokiaľ</b> vždy uvádza podmienku (antecedent), <b>pokiaľ nie</b> uvádza negovaný antecedent;</li><li>výrok po <b>vtedy, keď</b> chápeme ako antecedent;</li><li><b>vtedy a len vtedy, keď</b> (práve vtedy, keď) uvádza nutnú a dostatočnú podmienku, teda ekvivalenciu ↔;</li><li><b>iba ak, len vtedy keď, len pokiaľ, len ak</b> uvádzajú nutnú podmienku (konzekvent);</li><li><b>ale</b> čítame ako konjunkciu, rovnako <b>hoci</b> a <b>i keď</b>;</li><li><b>okrem</b> a <b>ale nie</b> uvádzajú konjunkciu s negáciou.</li></ul>
${box('warn', 'Pozor na poradie vo vete', `<p>Poradie slov vo vete nie je poradie v implikácii. „Mária bude šťastná, <b>ak</b> Ján tancuje“ je ${F_('P → T')}, hoci Mária je vo vete prvá. Vždy hľadaj, za ktorým slovom výrok stojí.</p>`)}` },

  { id: 'dokaz', part: 'Dôkazy', t: 'Čo je dôkaz a ako ho zapisovať', gens: ['rid'], opts: { rules: ['A', '∧I', '∧E', 'DN'] }, html: `
<p>Tabuľka overí platnosť mechanicky, ale pri veľa premenných je obrovská. <b>Dôkaz</b> (prirodzená dedukcia) ukazuje platnosť inak: zo záveru sa krok po kroku dostaneme pomocou malého počtu pravidiel, z ktorých každé je zjavne platné.</p>
<p>Zápis ${F_('P → Q, P ⊢ Q')} (sekvent) znamená: z premís P → Q a P sa dá dokázať Q.</p>
<h4>Lemmonov štýl</h4><p>Každý riadok dôkazu má štyri časti:</p>
<ol><li><b>Závislosti</b>: čísla predpokladov, od ktorých riadok závisí.</li><li><b>Číslo riadku</b> v zátvorke.</li><li><b>Formula</b>.</li><li><b>Zdôvodnenie</b>: citované riadky a názov pravidla.</li></ol>
${pf([['1', 1, 'P → Q', 'A', 'premisa, závisí sama od seba'], ['2', 2, 'P', 'A', 'premisa'], ['1,2', 3, 'Q', '1,2 MPP', 'závisí od oboch citovaných riadkov']], 'Príklad')}
<h4>Pravidlo A (predpoklad)</h4><p>Na akomkoľvek kroku môžeme zaviesť akýkoľvek predpoklad. Predpoklad závisí sám od seba (do závislostí píšeme jeho vlastné číslo). Premisy sú tiež predpoklady.</p>
<h4>Závislosti</h4><p>Riadok odvodený pravidlom závisí od všetkého, od čoho závisia citované riadky (zjednotenie ich závislostí). Výnimkou sú CP, RAA a ∨E, ktoré pomocný predpoklad <b>uvoľnia</b> (vypustia).</p>
<p>Dôkaz je hotový, keď máme riadok so záverom, ktorý závisí <b>len od premís</b>.</p>
${box('tip', 'V aplikácii', `<p>Závislosti počíta aplikácia sama. Ty píšeš formulu, vyberáš pravidlo a čísla citovaných riadkov. Každý riadok sa hneď skontroluje.</p>`)}` },

  { id: 'konj', part: 'Dôkazy', t: 'Pravidlá ∧I, ∧E, DN', gens: ['rcon'], opts: { rules: ['∧I', '∧E', 'DN'] }, html: `
<h4>Zavedenie konjunkcie (∧I)</h4><p>Ak máš X a máš Y, môžeš napísať X ∧ Y (aj Y ∧ X). Cituješ oba riadky.</p>
<h4>Eliminácia konjunkcie (∧E, Simp.)</h4><p>Z X ∧ Y môžeš napísať X a tiež Y. Cituješ jeden riadok.</p>
${box('warn', 'Pozor', `<p>∧E sa dá použiť len na riadok, ktorého <b>hlavná spojka je ∧</b>. Z ${F_('(P ∧ Q) → R')} nedostaneš P, lebo je to implikácia. Konjunkcia je len jej časť.</p>`)}
<h4>Dvojitá negácia (DN)</h4><p>Z X môžeš napísať ¬¬X a z ¬¬X môžeš napísať X. Vždy presne dve negácie pred celou formulou.</p>
${pf([['1', 1, 'P ∧ (Q ∧ R)', 'A'], ['1', 2, 'P', '1 ∧E'], ['1', 3, 'Q ∧ R', '1 ∧E'], ['1', 4, 'Q', '3 ∧E'], ['1', 5, 'R', '3 ∧E'], ['1', 6, 'P ∧ R', '2,5 ∧I'], ['1', 7, 'Q ∧ (P ∧ R)', '4,6 ∧I']], 'Riešený príklad: P ∧ (Q ∧ R) ⊢ Q ∧ (P ∧ R)')}
<p>Postup: najprv všetko rozober (∧E), potom poskladaj, čo treba (∧I).</p>` },

  { id: 'mpp', part: 'Dôkazy', t: 'Pravidlá MPP a MTT', gens: ['rcon'], opts: { rules: ['MPP', 'MTT'] }, html: `
<h4>Modus ponendo ponens (MPP, →E)</h4><p>Z <b>X → Y</b> a <b>X</b> plynie <b>Y</b>. „Ak prší, je mokro. Prší. Teda je mokro.“</p>
<h4>Modus tollendo tollens (MTT)</h4><p>Z <b>X → Y</b> a <b>¬Y</b> plynie <b>¬X</b>. „Ak prší, je mokro. Nie je mokro. Teda neprší.“</p>
${box('warn', 'Najčastejšie chyby', `<p><b>Afirmácia konzekventu:</b> z X → Y a Y neplynie X. Mokro môže byť aj preto, že niekto polieval.</p><p><b>Negácia antecedentu:</b> z X → Y a ¬X neplynie ¬Y. Ak neprší, mokro môže byť z iného dôvodu.</p><p>Aplikácia tieto kroky v dôkaze rozpozná a pomenuje.</p>`)}
${box('warn', 'MTT a negácie', `<p>MTT potrebuje <b>presne</b> negáciu konzekventu. Ak máš ${F_('¬P → ¬Q')} a ${F_('Q')}, negácia konzekventu je ${F_('¬¬Q')}. Najprv urob DN. Výsledok MTT je ${F_('¬¬P')} a až ďalšie DN dá ${F_('P')}.</p>`)}
${pf([['1', 1, '¬P → ¬Q', 'A'], ['2', 2, 'Q', 'A'], ['2', 3, '¬¬Q', '2 DN'], ['1,2', 4, '¬¬P', '1,3 MTT'], ['1,2', 5, 'P', '4 DN']], 'Riešený príklad: ¬P → ¬Q, Q ⊢ P')}
${pf([['1', 1, 'Q → (P → R)', 'A'], ['2', 2, '¬R', 'A'], ['3', 3, 'Q', 'A'], ['1,3', 4, 'P → R', '1,3 MPP', 'konzekvent je zase implikácia'], ['1,2,3', 5, '¬P', '4,2 MTT']], 'Riešený príklad: Q → (P → R), ¬R, Q ⊢ ¬P')}` },

  { id: 'disj', part: 'Dôkazy', t: 'Pravidlá ∨I a ∨E', gens: ['rcon'], opts: { rules: ['∨I', '∨E'] }, html: `
<h4>Zavedenie disjunkcie (∨I)</h4><p>Z X môžeš napísať X ∨ Y aj Y ∨ X, kde <b>Y je čokoľvek</b>. Ak platí X, tak určite platí „X alebo hocičo“.</p>
${box('warn', 'Pozor', `<p>Opačne to nejde: z X ∨ Y nemôžeš odvodiť X. Nevieš, ktorý disjunkt platí. Na to je ∨E.</p>`)}
<h4>Eliminácia disjunkcie (∨E, rozbor prípadov)</h4>
<p>Máš X ∨ Y a chceš dokázať Z. Nevieš, ktorá možnosť platí, tak preskúmaš obe:</p>
<ol><li>predpokladaj X (A) a odvoď Z,</li><li>predpokladaj Y (A) a odvoď Z,</li><li>v oboch prípadoch platí Z, takže Z platí. Napíšeš Z a cituješ <b>5 riadkov</b>: disjunkciu, predpoklad 1, záver 1, predpoklad 2, záver 2.</li></ol>
<p>Oba predpoklady sa zo závislostí <b>vypustia</b>.</p>
${pf([['1', 1, 'P ∨ Q', 'A'], ['2', 2, 'P', 'A', 'prvý prípad'], ['2', 3, 'Q ∨ P', '2 ∨I'], ['4', 4, 'Q', 'A', 'druhý prípad'], ['4', 5, 'Q ∨ P', '4 ∨I'], ['1', 6, 'Q ∨ P', '1,2,3,4,5 ∨E', 'predpoklady 2 a 4 sú uvoľnené']], 'Riešený príklad: P ∨ Q ⊢ Q ∨ P')}
${box('tip', 'Keď jeden prípad vedie k sporu', `<p>Napr. P ∨ Q, ¬P ⊢ Q. V prípade P máš P aj ¬P. Vtedy predpokladaj ¬Q, spor dá cez RAA ¬¬Q a DN dá Q. Tak dostaneš záver aj v „nemožnom“ prípade.</p>`)}` },

  { id: 'cp', part: 'Dôkazy', t: 'Kondicionálny dôkaz (CP)', gens: ['rcon'], opts: { rules: ['CP'] }, html: `
<p>Ako dokázať implikáciu X → Y? Ukážeš, že <b>keby</b> platilo X, platilo by aj Y. Teda:</p>
<ol><li>predpokladaj X (pravidlo A),</li><li>odvoď Y (môžeš použiť aj premisy),</li><li>napíš X → Y, cituj predpoklad X a riadok s Y, pravidlo CP.</li></ol>
<p>Predpoklad X sa zo závislostí <b>vypustí</b>. Nová implikácia už od neho nezávisí, lebo X má v sebe ako antecedent.</p>
${pf([['1', 1, 'P → Q', 'A'], ['2', 2, 'Q → R', 'A'], ['3', 3, 'P', 'A', 'pomocný predpoklad = antecedent cieľa'], ['1,3', 4, 'Q', '1,3 MPP'], ['1,2,3', 5, 'R', '2,4 MPP'], ['1,2', 6, 'P → R', '3,5 CP', '3 zmizlo zo závislostí']], 'Riešený príklad: P → Q, Q → R ⊢ P → R')}
${pf([['1', 1, '(P ∧ Q) → R', 'A'], ['2', 2, 'P', 'A'], ['3', 3, 'Q', 'A'], ['2,3', 4, 'P ∧ Q', '2,3 ∧I'], ['1,2,3', 5, 'R', '1,4 MPP'], ['1,2', 6, 'Q → R', '3,5 CP'], ['1', 7, 'P → (Q → R)', '2,6 CP']], 'Vnorené CP: (P ∧ Q) → R ⊢ P → (Q → R)')}
${box('tip', 'Kedy CP', `<p>Vždy, keď je cieľ (alebo čiastkový cieľ) implikácia. Pri vnorených implikáciách predpokladaj postupne všetky antecedenty a CP použi viackrát, od vnútra.</p>`)}` },

  { id: 'raa', part: 'Dôkazy', t: 'Reductio ad absurdum (RAA)', gens: ['rcon'], opts: { rules: ['RAA'] }, html: `
<p>Nepriamy dôkaz: chceš ukázať, že X neplatí. Predpokladáš X a ukážeš, že vedie k <b>sporu</b>. Keďže spor nemôže platiť, predpoklad bol zlý, a teda platí ¬X.</p>
<ol><li>predpokladaj X (A),</li><li>odvoď nejaké Y aj ¬Y (a spoj ich ∧I do Y ∧ ¬Y),</li><li>napíš ¬X, cituj predpoklad a spor, pravidlo RAA.</li></ol>
<p>Predpoklad X sa zo závislostí vypustí.</p>
${pf([['1', 1, 'P → Q', 'A'], ['2', 2, 'P → ¬Q', 'A'], ['3', 3, 'P', 'A', 'predpoklad, ktorý chceme vyvrátiť'], ['1,3', 4, 'Q', '1,3 MPP'], ['2,3', 5, '¬Q', '2,3 MPP'], ['1,2,3', 6, 'Q ∧ ¬Q', '4,5 ∧I', 'spor'], ['1,2', 7, '¬P', '3,6 RAA']], 'Riešený príklad: P → Q, P → ¬Q ⊢ ¬P')}
<h4>Dôkaz kladného záveru</h4><p>Ak chceš dokázať Z (bez negácie), predpokladaj <b>¬Z</b>. RAA dá ¬¬Z a pravidlo DN potom Z. Aplikácia neuzná Z priamo z RAA, rovnako ako skriptá.</p>
${pf([['1', 1, '¬P → P', 'A'], ['2', 2, '¬P', 'A'], ['1,2', 3, 'P', '1,2 MPP'], ['1,2', 4, 'P ∧ ¬P', '3,2 ∧I'], ['1', 5, '¬¬P', '2,4 RAA'], ['1', 6, 'P', '5 DN']], 'Riešený príklad: ¬P → P ⊢ P (Claviov zákon)')}
${box('tip', 'Kedy RAA', `<p>Keď je cieľ negácia, alebo keď už nič iné nefunguje. RAA je univerzálny „posledný pokus“: predpokladaj opak cieľa a hľadaj spor s premisami.</p>`)}` },

  { id: 'strategia', part: 'Dôkazy', t: 'Stratégia hľadania dôkazu', gens: ['proof'], html: `
<p>Dôkaz sa najľahšie hľadá <b>od konca</b>: pozri sa na tvar záveru a vyber stratégiu podľa jeho hlavnej spojky. Popritom rozober premisy (∧E, MPP, MTT), čo sa dá.</p>
<div class="tt"><table class="truth"><thead><tr><th>cieľ</th><th>stratégia</th></tr></thead><tbody>
<tr><td>X → Y</td><td style="text-align:left">predpokladaj X, odvoď Y, CP</td></tr>
<tr><td>X ∧ Y</td><td style="text-align:left">odvoď X, odvoď Y, ∧I</td></tr>
<tr><td>X ∨ Y</td><td style="text-align:left">∨I z X alebo Y; ak to nejde, ∨E z disjunkcie v premisách</td></tr>
<tr><td>¬X</td><td style="text-align:left">MTT, alebo predpokladaj X a RAA</td></tr>
<tr><td>atóm P</td><td style="text-align:left">∧E, MPP, ∨E; ak nič, predpokladaj ¬P, RAA a DN</td></tr>
</tbody></table></div>
${pf([['1', 1, 'P ∨ Q', 'A'], ['2', 2, '¬P', 'A'], ['3', 3, 'P', 'A', 'prípad 1'], ['4', 4, '¬Q', 'A', 'v prípade 1 je spor, ideme cez RAA'], ['2,3', 5, 'P ∧ ¬P', '3,2 ∧I'], ['2,3', 6, '¬¬Q', '4,5 RAA'], ['2,3', 7, 'Q', '6 DN'], ['8', 8, 'Q', 'A', 'prípad 2'], ['1,2', 9, 'Q', '1,3,7,8,8 ∨E']], 'Riešený príklad: P ∨ Q, ¬P ⊢ Q (disjunktívny sylogizmus)')}
${box('tip', 'Nápoveda v aplikácii', `<p>Prvé ťuknutie na Nápovedu ukáže stratégiu podľa aktuálneho cieľa. Druhé ukáže konkrétny krok, ktorý sa dá urobiť hneď (napr. „Z riadkov 1 a 3 dostaneš pomocou MPP Q“).</p>`)}` },

  { id: 'slovne', part: 'Slovné úlohy', t: 'Slovné úlohy', gens: ['word'], html: `
<p>Slovná úloha je argument v prirodzenom jazyku. Riešiš ju v troch krokoch:</p>
<ol><li><b>Preklad</b>: každú premisu a záver zvlášť podľa schémy. Slová ako „preto“, „teda“, „z toho vyplýva“, „to znamená“ označujú záver.</li><li><b>Platnosť</b>: tabuľkou alebo skrátenou metódou. Ak je neplatný, nájdi protipríklad.</li><li><b>Dôkaz</b>: ak je platný, dokáž ho pravidlami.</li></ol>
<div class="ex"><p class="excap">Riešený príklad (F15)</p><p>„Ak existuje desiata planéta, potom je jej obežná dráha kolmá na dráhu ostatných planét. Desiata planéta je zodpovedná za vymretie dinosaurov alebo jej obežná dráha nie je kolmá. Desiata planéta nie je zodpovedná za smrť dinosaurov. Preto neexistuje desiata planéta.“</p><p>Schéma: E existuje desiata planéta, K dráha je kolmá, D je zodpovedná za vymretie.</p><p>Preklad: ${F_('E → K, D ∨ ¬K, ¬D ∴ ¬E')}</p></div>
${pf([['1', 1, 'E → K', 'A'], ['2', 2, 'D ∨ ¬K', 'A'], ['3', 3, '¬D', 'A'], ['4', 4, 'E', 'A', 'cieľ je ¬E, skúsime RAA'], ['1,4', 5, 'K', '1,4 MPP'], ['6', 6, 'D', 'A', 'prípad 1 z disjunkcie 2'], ['3,6', 7, 'D ∧ ¬D', '6,3 ∧I'], ['3,6', 8, '¬E', '4,7 RAA'], ['9', 9, '¬K', 'A', 'prípad 2'], ['1,4,9', 10, 'K ∧ ¬K', '5,9 ∧I'], ['1,9', 11, '¬E', '4,10 RAA'], ['1,2,3', 12, '¬E', '2,6,8,9,11 ∨E']], 'Dôkaz')}
${box('tip', 'Pri preklade', `<p>Platí všetko z kapitol o preklade: D – N, „ak“ vs. „iba ak“, „ale“ = ∧, rozsah negácie. Dôkaz robíme so vzorovým prekladom, aby presne sedeli tvary formúl.</p>`)}` },
];

// prepojenie: úloha → kapitola
function chapterFor(id, opts) {
  opts = opts || {};
  const by = x => CHAPTERS.findIndex(c => c.id === x);
  switch (id) {
    case 'conn': return by('spojky');
    case 'eval': return by('eval');
    case 'table': return by('tabulka');
    case 'classify': return by('taut');
    case 'equiv': case 'consist': return by('ekviv');
    case 'valid': return by('platnost');
    case 'trans': return by(opts.set === 'basic' ? 'preklad' : 'nd');
    case 'rid': case 'rcon': {
      const r = (opts.rules || []);
      if (r.includes('RAA') && r.length <= 4) return by('raa');
      if (r.includes('CP') && r.length <= 4) return by('cp');
      if (r.some(x => x === '∨I' || x === '∨E') && r.length <= 5) return by('disj');
      if (r.includes('MPP') || r.includes('MTT')) return by('mpp');
      if (r.includes('∧I') || r.includes('DN')) return by('konj');
      return by('dokaz');
    }
    case 'proof': return by('strategia');
    default: return by('slovne');
  }
}
const LEVEL_CH = [['vyrok', 'spojky'], ['spojky'], ['eval'], ['tabulka'], ['taut'], ['ekviv'], ['platnost'], ['preklad'], ['nd'], ['dokaz', 'konj'], ['mpp'], ['disj'], ['cp'], ['raa'], ['strategia'], ['slovne', 'platnost'], ['slovne', 'strategia']];

function chapterHTML(i) {
  const c = CHAPTERS[i];
  return `<p class="muted small">${c.part.toUpperCase()}</p><h2>${c.t}</h2><div class="theory">${c.html}</div>`;
}
// prekrytie s teóriou počas úlohy
function openTheory(i) {
  let ov = document.getElementById('theoryOv');
  if (!ov) {
    ov = document.createElement('div'); ov.id = 'theoryOv'; ov.className = 'overlay';
    ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true');
    document.body.appendChild(ov);
    ov.addEventListener('click', e => { if (e.target === ov) closeTheory(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeTheory(); });
  }
  const nav = `<div class="row ovnav"><button class="btn ghost prev" ${i <= 0 ? 'disabled' : ''}>← ${i > 0 ? esc(CHAPTERS[i - 1].t) : ''}</button><button class="btn ghost nxt" ${i >= CHAPTERS.length - 1 ? 'disabled' : ''}>${i < CHAPTERS.length - 1 ? esc(CHAPTERS[i + 1].t) : ''} →</button></div>`;
  ov.innerHTML = `<div class="ovpanel"><div class="ovhead"><span class="small muted">Teória ${i + 1} / ${CHAPTERS.length}</span><button class="btn close">Zavrieť</button></div><div class="ovbody">${chapterHTML(i)}${nav}</div></div>`;
  ov.hidden = false;
  document.body.style.overflow = 'hidden';
  $('.close', ov).addEventListener('click', closeTheory);
  $('.prev', ov).addEventListener('click', () => openTheory(i - 1));
  $('.nxt', ov).addEventListener('click', () => openTheory(i + 1));
  $('.ovpanel', ov).scrollTop = 0;
  $('.close', ov).focus();
}

    th: `<ul><li><b>MPP</b> (modus ponendo ponens): z X → Y a X odvodíš Y.</li><li><b>MTT</b> (modus tollendo tollens): z X → Y a ¬Y odvodíš ¬X.</li></ul><p><b>Pozor, najčastejšie chyby:</b> afirmácia konzekventu (X → Y, Y, teda X) a negácia antecedentu (X → Y, ¬X, teda ¬Y). Tieto kroky neplatia.</p><p>Ak máš ¬P → ¬Q a Q, MTT potrebuje ¬¬Q. Najprv urob DN.</p>${ex([['1', 1, '¬P → ¬Q', 'A'], ['2', 2, 'Q', 'A'], ['2', 3, '¬¬Q', '2 DN'], ['1,2', 4, '¬¬P', '1,3 MTT'], ['1,2', 5, 'P', '4 DN']])}` },

    th: '<p>Teraz už bez obmedzení. Stratégia podľa tvaru záveru:</p><ul><li><b>X → Y</b>: predpokladaj X, odvoď Y, CP.</li><li><b>X ∧ Y</b>: odvoď oba, ∧I.</li><li><b>X ∨ Y</b>: ∨I z jedného člena, alebo ∨E z disjunkcie v premisách.</li><li><b>¬X</b>: MTT, alebo predpokladaj X a RAA.</li><li><b>Atóm</b>: MPP, ∧E, ∨E, alebo predpokladaj jeho negáciu a RAA + DN.</li></ul><p>Tlačidlo Nápoveda najprv ukáže stratégiu, pri druhom ťuknutí konkrétny krok.</p>' },
  { part: 'Slovné úlohy', t: 'Slovné úlohy: preklad a platnosť', mix: [['word', {}, 1]], d: [1, 5], n: 4, pass: 3,
    th: '<p>Úsudok v prirodzenom jazyku najprv prelož podľa schémy (každá premisa a záver zvlášť). Potom rozhodni, či je platný. Ak nie je, nájdi protipríklad.</p><p>Na preklad platí všetko z levelov 8 a 9: D – N, „ak“ vs. „iba ak“, „ale“ = ∧.</p>' },
  { part: 'Slovné úlohy', t: 'Slovné úlohy: dôkaz', mix: [['wordproof', {}, 1]], d: [1, 5], n: 4, pass: 3,
    th: '<p>Ako v skriptách v časti F: prelož úsudok a nájdi jeho dôkaz základnými pravidlami. Dôkaz sa robí so vzorovým prekladom, aby sedeli tvary formúl.</p>' },
];

function levelUnlocked(i) { return S.unlockAll || i === 0 || (S.levels[i - 1] && S.levels[i - 1].passed); }
function starsOf(i) { const L = S.levels[i]; return L ? L.stars || 0 : 0; }
const starHTML = n => '<span class="stars">' + [1, 2, 3].map(k => k <= n ? '★' : '<span class="off">★</span>').join('') + '</span>';

// ================= sedenie =================
const appEl = document.getElementById('app');
function rating(id) { return S.rating[id] || 1; }
function runSession(cfg) {
  let i = 0, score = 0;
  const results = [];
  appEl.innerHTML = `<div class="sessbar"><button class="btn ghost back">← Späť</button><div class="pbar">${Array.from({ length: cfg.n }, () => '<i></i>').join('')}</div><span class="small muted cnt"></span></div><div class="card task"></div>`;
  $('.back', appEl).addEventListener('click', () => { save(); route(); });
  const bar = $$('.pbar i', appEl);
  function next() {
    if (i >= cfg.n) return finish();
    bar.forEach((b, k) => b.classList.toggle('now', k === i));
    $('.cnt', appEl).textContent = `${i + 1} / ${cfg.n}`;
    const [id, opts] = cfg.pick(i);
    const d = clamp(Math.round(cfg.diff(id)), 1, 5);
    const task = GEN[id].gen(d, opts || {});
    const card = $('.task', appEl);
    card.innerHTML = `<div class="meta"><span>${GEN[id].label}</span><span class="dots" title="náročnosť">${dots(d)}</span><button class="btn thbtn" type="button">Teória</button></div><div class="body"></div><div class="next"></div>`;
    $('.thbtn', card).addEventListener('click', () => openTheory(chapterFor(id, opts)));
    let got = false;
    task.mount($('.body', card), res => {
      if (got) return; got = true;
      results.push(res.ok);
      if (res.ok) score++;
      bar[i].classList.remove('now'); bar[i].classList.add(res.ok ? 'ok' : 'bad');
      S.rating[id] = clamp(rating(id) + (res.ok ? 0.4 : -0.6), 1, 5);
      recordMistakes(res.tags);
      if (res.ok) recordTrained(task.trains);
      S.solved++;
      save();
      const nb = document.createElement('button');
      nb.className = 'btn primary';
      nb.textContent = i + 1 >= cfg.n ? 'Výsledok' : 'Ďalšia úloha';
      nb.addEventListener('click', () => { i++; next(); window.scrollTo({ top: 0 }); });
      $('.next', card).appendChild(nb);
    });
  }
  function finish() {
    const r = cfg.onFinish ? cfg.onFinish(score) : {};
    appEl.innerHTML = `<div class="card summary stack"><p class="muted">${esc(cfg.title)}</p><div class="score">${score} / ${cfg.n}</div>${r.html || ''}<div class="row" style="justify-content:center">${r.buttons || ''}<button class="btn again">Znova</button><button class="btn primary home">${r.homeLabel || 'Späť'}</button></div></div>`;
    $('.again', appEl).addEventListener('click', () => runSession(cfg));
    $('.home', appEl).addEventListener('click', () => (r.onHome ? r.onHome() : route()));
    if (r.wire) r.wire(appEl);
  }
  next();
}
function weightedPick(mix) {
  const tot = mix.reduce((a, m) => a + (m[2] || 1), 0);
  let x = Math.random() * tot;
  for (const m of mix) { x -= m[2] || 1; if (x <= 0) return m; }
  return mix[mix.length - 1];
}
function startLevel(li) {
  const L = LEVELS[li];
  runSession({
    title: `Level ${li + 1}: ${L.t}`, n: L.n,
    pick: () => { const m = weightedPick(L.mix); return [m[0], m[1]]; },
    diff: id => clamp(rating(id), L.d[0], L.d[1]),
    onFinish(score) {
      const passed = score >= L.pass;
      const stars = score >= L.n ? 3 : score >= L.n - 1 ? 2 : passed ? 1 : 0;
      const prev = S.levels[li] || {};
      S.levels[li] = { passed: prev.passed || passed, stars: Math.max(prev.stars || 0, stars), best: Math.max(prev.best || 0, score) };
      save();
      const hasNext = li + 1 < LEVELS.length;
      return {
        html: passed ? `<p>${starHTML(stars)}</p><p>Level je splnený${hasNext ? ', ďalší sa odomkol' : ''}.</p>` : `<p>Na splnenie treba aspoň ${L.pass} správnych. Skús to znova, náročnosť sa prispôsobí.</p>`,
        buttons: passed && hasNext ? '<button class="btn primary nextlvl">Ďalší level</button>' : '',
        homeLabel: 'Prehľad kurzu',
        onHome: () => { location.hash = 'kurz'; route(); },
        wire: el => { const b = $('.nextlvl', el); if (b) b.addEventListener('click', () => openLevel(li + 1)); },
      };
    },
  });
}
function openLevel(li) {
  const L = LEVELS[li];
  appEl.innerHTML = `<div class="sessbar"><button class="btn ghost back">← Kurz</button></div><div class="card stack"><p class="muted small">LEVEL ${li + 1} · ${L.part.toUpperCase()}</p><h2>${L.t}</h2><div class="theory">${L.th}</div><p class="small muted">${L.n} úloh, na splnenie treba ${L.pass} správnych.</p><div class="row"><button class="btn primary go">Začať</button>${LEVEL_CH[li].map(x => { const k = CHAPTERS.findIndex(c => c.id === x); return `<button class="btn thl" data-k="${k}">Teória: ${esc(CHAPTERS[k].t)}</button>`; }).join('')}</div></div>`;
  $('.back', appEl).addEventListener('click', () => route());
  $('.go', appEl).addEventListener('click', () => startLevel(li));
  $$('.thl', appEl).forEach(b => b.addEventListener('click', () => openTheory(+b.dataset.k)));
  window.scrollTo({ top: 0 });
}

// ================= pohľady =================
function viewCourse() {
  const parts = [...new Set(LEVELS.map(l => l.part))];
  const curIdx = LEVELS.findIndex((_, i) => !(S.levels[i] && S.levels[i].passed));
  let h = `<div class="stack"><div><h2>Kurz</h2><p class="muted">${LEVELS.length} levelov od spojok po dôkazy a slovné úlohy. Každý level má krátke zhrnutie, odkaz na podrobnú teóriu a sadu úloh. Splnený level odomkne ďalší.</p></div>`;
  parts.forEach(p => {
    h += `<div class="part"><h3>${p}</h3><div class="levels">`;
    LEVELS.forEach((L, i) => {
      if (L.part !== p) return;
      const un = levelUnlocked(i), done = S.levels[i] && S.levels[i].passed;
      h += `<button class="lvl ${done ? 'done' : ''} ${i === curIdx ? 'cur' : ''}" data-i="${i}" ${un ? '' : 'disabled'}><span class="num">${i + 1}</span><span><span class="t">${L.t}</span><br><span class="s">${un ? (done ? 'Splnené' : i === curIdx ? 'Na rade' : 'Odomknuté') : 'Zamknuté'}</span></span>${done ? starHTML(starsOf(i)) : '<span></span>'}</button>`;
    });
    h += '</div></div>';
  });
  h += `<div class="part"><h3>Diagramy</h3><p class="muted small">Doplníme neskôr.</p></div><label class="row small muted" style="margin-top:12px"><input type="checkbox" id="ua" ${S.unlockAll ? 'checked' : ''}> Odomknúť všetky levely</label></div>`;
  appEl.innerHTML = h;
  $$('.lvl', appEl).forEach(b => b.addEventListener('click', () => openLevel(+b.dataset.i)));
  $('#ua', appEl).addEventListener('change', e => { S.unlockAll = e.target.checked; save(); viewCourse(); });
}
const PRACTICE = [
  ['Tabuľky hodnôt', ['conn', 'eval', 'table', 'classify', 'equiv', 'consist', 'valid']],
  ['Pravidlá a dôkazy', ['rid', 'rcon', 'proof']],
  ['Preklad a slovné úlohy', ['trans', 'word', 'wordproof']],
];
let practiceDiff = 0;
function viewPractice() {
  let h = `<div class="stack"><div><h2>Voľné precvičovanie</h2><p class="muted">Vyber si jednu tému. Pri voľbe Auto sa náročnosť prispôsobuje tomu, ako sa ti darí.</p></div><div><label class="lab">Náročnosť</label><div class="diffsel">${['Auto', 1, 2, 3, 4, 5].map((x, k) => `<button type="button" data-d="${k}" aria-pressed="${practiceDiff === k}">${x}</button>`).join('')}</div></div>`;
  PRACTICE.forEach(([name, ids]) => {
    h += `<div class="part"><h3>${name}</h3><div class="topics">${ids.map(id => `<button class="topic" data-id="${id}"><span class="t">${GEN[id].label}</span><br><span class="s">${GEN[id].desc}</span><br><span class="small dots">${dots(Math.round(rating(id)))}</span></button>`).join('')}</div></div>`;
  });
  appEl.innerHTML = h + '</div>';
  $$('.diffsel button', appEl).forEach(b => b.addEventListener('click', () => { practiceDiff = +b.dataset.d; viewPractice(); }));
  $$('.topic', appEl).forEach(b => b.addEventListener('click', () => practice(b.dataset.id, {})));
}
function practice(id, opts, title) {
  runSession({
    title: title || GEN[id].label, n: 10,
    pick: () => [id, opts],
    diff: x => (practiceDiff ? practiceDiff : rating(x)),
    onFinish: () => ({ html: '<p>Výsledok sa započítal do tvojich štatistík chýb.</p>' }),
  });
}
function viewWeak() {
  const items = Object.entries(S.mistakes).filter(([t, n]) => n >= 1 && TAGS[t]).sort((a, b) => b[1] - a[1]);
  let h = `<div class="stack"><div><h2>Moje chyby</h2><p class="muted">Aplikácia si pri každej chybe zapamätá, aký typ chyby to bol. Keď určitý typ potom zvládaš, číslo klesá.</p></div>`;
  if (!items.length) h += `<div class="card"><p>Zatiaľ tu nič nie je. Po prvých úlohách sa tu objavia typy chýb, ktoré sa ti stávajú najčastejšie, s tlačidlom na ich cielené precvičenie.</p><p class="small muted" style="margin-top:8px">Vyriešených úloh: ${S.solved}</p></div>`;
  else {
    const max = items[0][1];
    h += `<div class="card"><button class="btn primary mix">Precvičiť moje najčastejšie chyby</button>` + items.map(([t, n]) => `<div class="weak"><div><div>${TAGS[t][0]}</div><div class="bar" style="width:${Math.max(8, (n / max) * 100)}%"></div></div><span class="small muted">${Math.round(n)}×</span><button class="btn" data-t="${t}">Precvičiť</button></div>`).join('') + `<p class="small muted" style="margin-top:10px">Vyriešených úloh: ${S.solved}</p></div>`;
  }
  appEl.innerHTML = h + '<div><button class="btn ghost reset">Vymazať celý postup</button><span class="small muted confirm" hidden> Naozaj? <button class="btn yes">Áno, vymazať</button></span></div></div>';
  $$('.weak .btn', appEl).forEach(b => b.addEventListener('click', () => { const T = TAGS[b.dataset.t]; practice(T[1], T[2] || {}, 'Precvičenie: ' + T[0]); }));
  const mx = $('.mix', appEl);
  if (mx) mx.addEventListener('click', () => {
    const top = items.slice(0, 4);
    runSession({ title: 'Precvičenie mojich chýb', n: 10, pick: () => { const [t] = weightedPick(top.map(([t, n]) => [t, null, n])); return [TAGS[t][1], TAGS[t][2] || {}]; }, diff: x => rating(x), onFinish: () => ({}) });
  });
  $('.reset', appEl).addEventListener('click', () => { $('.confirm', appEl).hidden = false; });
  $('.yes', appEl).addEventListener('click', () => { S = defState(); save(); viewWeak(); });
}

const VIEWS = { kurz: viewCourse, teoria: viewTheory, trening: viewPractice, chyby: viewWeak };
function route() {
  let v = (location.hash || '').replace('#', '');
  if (!VIEWS[v]) v = 'kurz';
  $$('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.v === v)));
  VIEWS[v]();
}
$$('.tab').forEach(t => t.addEventListener('click', () => { closeTheory(); if (t.dataset.v === 'teoria') theoryCur = -1; if (location.hash === '#' + t.dataset.v) route(); else location.hash = t.dataset.v; }));
window.addEventListener('hashchange', route);
route();
initSync();

</script>
</body>
</html>
